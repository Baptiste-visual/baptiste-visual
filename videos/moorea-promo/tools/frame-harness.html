<!doctype html>
<html><head><meta charset="utf-8"><base href="../">
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0f1722}
#host{position:relative;width:1920px;height:1080px;overflow:hidden}
#host > [data-composition-id]{position:absolute;inset:0;width:100%;height:100%}
.clip{position:absolute}</style></head>
<body><div id="host"></div>
<script>
// Dev-only harness (not part of the video): loads compositions/frames/<f>.html standalone,
// seeks its timeline to ?t= and lets headless Chrome screenshot it. Usage: tools/snap.sh <frame_id> <t> [t...]
(async function () {
  var q = new URLSearchParams(location.search), f = q.get('f'), t = parseFloat(q.get('t') || '0');
  window.__timelines = {};
  var html = await new Promise(function (res, rej) { var x = new XMLHttpRequest(); x.open('GET', 'compositions/frames/' + f + '.html'); x.onload = function () { res(x.responseText); }; x.onerror = rej; x.send(); });
  var tpl = document.createElement('template'); tpl.innerHTML = html.trim();
  var inner = tpl.content.querySelector('template') ? tpl.content.querySelector('template').content : tpl.content;
  var host = document.getElementById('host');
  var scripts = [];
  inner.querySelectorAll('script').forEach(function (s) { scripts.push(s); s.remove(); });
  host.appendChild(document.importNode(inner, true));
  for (const s of scripts) {
    await new Promise(function (res) {
      var n = document.createElement('script');
      if (s.src || s.getAttribute('src')) { n.src = s.getAttribute('src'); n.onload = res; n.onerror = res; document.body.appendChild(n); }
      else { n.textContent = s.textContent; document.body.appendChild(n); res(); }
    });
  }
  await document.fonts.ready;
  var tl = window.__timelines[q.get('id') || f]; if (!tl) { document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;top:0;left:0;color:red;font:40px sans-serif;z-index:99">NO TIMELINE ' + f + '</div>'); return; }
  tl.seek(Math.max(0, t - 0.04)); tl.seek(t);
  document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;right:8px;bottom:6px;color:#0f0;font:22px monospace;z-index:99">' + f + ' t=' + t.toFixed(2) + '</div>');
})();
</script></body></html>
