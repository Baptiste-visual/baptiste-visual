    tl.fromTo($('c' + n), { x: c.dx * 2.2, y: 800, rotation: c.from, scale: 1.3 },
                          { x: c.dx, y: c.dy, rotation: c.rot, scale: 1, duration: .2, ease: 'power4.in' }, c.land - .2);
    tl.fromTo($('c' + n + 'q'), { scaleX: 1.06, scaleY: .9 }, { scaleX: 1, scaleY: 1, duration: .26, ease: 'back.out(2)', immediateRender: false }, c.land);
    tl.fromTo($('c' + n + 'f'), { opacity: .9 }, { opacity: 0, duration: .12, ease: 'none', immediateRender: false }, c.land);
    if (n > 1) tl.fromTo($('c' + (n - 1) + 'd'), { opacity: 0 }, { opacity: .5, duration: .12, ease: 'power1.out', immediateRender: false }, c.land);
    shake($('shake5'), c.land, i === 3 ? 12 : 9, true);
  });

  // Scene 4 (1.20–1.60): answer stamps, problem word turns to stone; 1.40 signpost pulses orange
  stone($('w5'), $('w5m'), $('w5s'), 1.2);
  stamp($('a5'), $('b5'), 1.2);
  tl.fromTo($('sign4'), { scale: 1, backgroundColor: 'rgba(10,12,16,0.78)', boxShadow: '0 0 0px 0px rgba(225,83,17,0)' },
                        { scale: 1.35, backgroundColor: '#e15311', boxShadow: '0 0 34px 8px rgba(225,83,17,0.85)', duration: .1, ease: 'power2.out', immediateRender: false }, 1.4);
  tl.to($('sign4'), { scale: 1, duration: .26, ease: 'back.out(3)' }, 1.5);
  tl.fromTo($('ring4'), { scale: 1, opacity: 1 }, { scale: 2.7, opacity: 0, duration: .45, ease: 'power2.out', immediateRender: false }, 1.4);

  // Scene 5 (1.60–2.00): toi dot hops onto the top card
  hop($('d5x'), $('d5y'), $('d5s'), $('stack'), -70, 470, 350, 730, 544, 1.6, .2);

  // Scene 6 (2.00–2.40): whip-pan out
  whip($('p5'), 2.0);

  /* ===================== PART 6 — BRACELET À SEC ===================== */
  // Scene 7 (2.40): problem word erupts
  erupt($('w6'), 2.4);
  shake($('shake6'), 2.42, 8, false);

  // Scene 8 (2.80–3.20): the glow button falls red-hot
  tl.fromTo($('bfall'), { y: -640, rotation: -9, scale: 1.12 }, { y: 0, rotation: 0, scale: 1, duration: .4, ease: 'power1.in' }, 2.8);
  tl.fromTo($('hot'), { opacity: 1 }, { opacity: 0, duration: .4, ease: 'power2.out' }, 3.2);
  tl.fromTo($('rim'), { opacity: 1 }, { opacity: 0, duration: .5, ease: 'power2.out' }, 3.2);

  // Scene 9 (3.20–3.60): LAND + QUENCH, steps pop on 8ths
  tl.fromTo($('bsq'), { scaleX: 1.07, scaleY: .84 }, { scaleX: 1, scaleY: 1, duration: .3, ease: 'back.out(2)', immediateRender: false }, 3.2);
  shake($('shake6'), 3.2, 13, false);
  stone($('w6'), $('w6m'), $('w6s'), 3.2);
  // steam burst off the quenched button (seeded)
  var steam = $('steam');
  for (var k = 0; k < 12; k++) {
    var side = k % 3, px, py;
    if (side === 2) { px = rnd() < .5 ? 515 + rnd() * 30 : 1375 + rnd() * 30; py = 400 + rnd() * 140; }
    else { px = 540 + rnd() * 840; py = 380 + rnd() * 24; }
    var pf = document.createElement('div'); pf.className = '06-food-cash-puff';
    pf.style.left = px.toFixed(1) + 'px'; pf.style.top = py.toFixed(1) + 'px';
    steam.appendChild(pf);
    var st = 3.2 + k * .018, sc = 1.4 + rnd() * .9;
    tl.fromTo(pf, { opacity: 0 }, { opacity: .55 + rnd() * .25, duration: .06, ease: 'none' }, st);
    tl.fromTo(pf, { x: 0, y: 0, scale: .4 }, { x: (rnd() - .5) * 70, y: -(90 + rnd() * 90), scale: sc, duration: .6, ease: 'power2.out' }, st);
    tl.to(pf, { opacity: 0, duration: .45, ease: 'power1.in' }, st + .12);
  }
  // pssht-TING: shine sweep across the cooled button
  tl.fromTo($('shine'), { x: 0 }, { x: 1250, duration: .3, ease: 'power2.inOut' }, 3.32);
  // steps 1·2·3 pop, number circles flash orange then settle to the app's dark circle
  [1, 2, 3].forEach(function (n, i) {
    var at = 3.2 + .2 * i;
    tl.fromTo($('st' + n), { scale: 0, y: 40 }, { scale: 1.15, y: 0, duration: .1, ease: 'power3.out' }, at);
    tl.to($('st' + n), { scale: 1, duration: .12, ease: 'power2.inOut' }, at + .1);
    tl.fromTo($('n' + n), { backgroundColor: '#ff6a1f', boxShadow: '0 0 40px 10px rgba(255,106,31,0.85)' },
                          { backgroundColor: '#0f1722', boxShadow: '0 0 0px 0px rgba(255,106,31,0)', duration: .34, ease: 'power2.in' }, at + .1);
  });

  // embers inside the button: explicit seeded flicker
  ['e1', 'e2', 'e3', 'e4'].forEach(function (k, i) {
    var el = $(k), at = 2.8 + i * .05;
    tl.fromTo(el, { opacity: .5 }, { opacity: 1, duration: .2, ease: 'sine.inOut' }, at);
    for (var j = 1; j < 10; j++) tl.to(el, { opacity: j % 2 ? .45 + rnd() * .2 : 1, duration: .2, ease: 'sine.inOut' }, at + j * .2);
  });

  // Scene 10 (3.60–4.00): answer stamps; the button charges
  stamp($('a6'), $('b6'), 3.6);
  tl.fromTo($('charge'), { opacity: 0 }, { opacity: .85, duration: .07, ease: 'none', immediateRender: false }, 3.6);
  tl.to($('charge'), { opacity: 0, duration: .45, ease: 'power2.in' }, 3.67);
  ['e1', 'e2', 'e3', 'e4'].forEach(function (k, i) {
    tl.fromTo($(k), { scale: 1 }, { scale: 2.4, duration: .08, ease: 'power2.out', immediateRender: false }, 3.6 + i * .02);
    tl.to($(k), { scale: 1, duration: .3, ease: 'power2.in' }, 3.68 + i * .02);
  });

  // Scene 11 (4.00–4.40): toi dot hops onto the button
  hop($('d6x'), $('d6y'), $('d6s'), $('bdip'), -70, 330, 250, 650, 352, 4.0, .2);

  // Scene 12 (4.40–4.80): whip-pan out
  whip($('p6'), 4.4);

  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
