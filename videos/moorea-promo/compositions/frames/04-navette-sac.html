      tl.to(d, { y: -up, duration: tu, ease: 'power2.out' }, ts);
      tl.to(d, { y: -up + R(220, 380), duration: td, ease: 'power2.in' }, ts + tu);
      tl.to(d, { opacity: 0, scale: 0.4, duration: 0.14, ease: 'power1.in' }, ts + tu + td - 0.14);
    }
  }

  function steam(G, t) {
    for (var i = 0; i < 12; i++) {
      var x, y, sz = R(130, 210), rise;
      if (i < 7) { x = R(G.left + 60, G.right - 60); y = G.top + 14; rise = R(60, 95); sz = R(110, 160); }
      else { x = i % 2 ? G.left - R(0, 30) : G.right + R(0, 30); y = R(G.top + 60, G.bottom - 120); rise = R(90, 150); }
      var p = el(G.fx, '04-navette-sac-steam', 'left:' + (x - sz / 2) + 'px;top:' + (y - sz / 2) + 'px;width:' + sz + 'px;height:' + sz + 'px');
      gsap.set(p, { opacity: 0, scale: 0.5 });
      var ts = t + R(0, 0.22);
      tl.to(p, { keyframes: [
        { opacity: 0.6, scale: 1, y: -rise * 0.35, duration: 0.14, ease: 'power1.out' },
        { opacity: 0, scale: 1.5, y: -rise, duration: 0.5, ease: 'power1.out' } ] }, ts);
    }
  }

  function streaks(t) {
    var host = $('streaks');
    for (var i = 0; i < 9; i++) {
      var h = R(2, 6), w = R(380, 820), y = R(170, 960);
      var s = el(host, '04-navette-sac-streak', 'top:' + y + 'px;width:' + w + 'px;height:' + h + 'px');
      gsap.set(s, { x: 1960, opacity: 0 });
      var ts = t + 0.06 + i * 0.025, dur = Math.min(R(0.2, 0.28), t + 0.4 - ts);
      tl.set(s, { opacity: R(0.45, 0.9) }, ts);
      tl.to(s, { x: -w - 80, duration: dur, ease: 'power1.in' }, ts);
    }
  }

  function hop(G, t) {
    var land = t + 0.2, landY = G.top + G.dotSink;
    tl.fromTo(G.dot, { x: -60 }, { x: G.dotX, duration: 0.2, ease: 'none' }, t);
    tl.fromTo(G.dot, { y: 560 }, { y: 240, duration: 0.1, ease: 'power2.out' }, t);
    tl.to(G.dot, { y: landY, duration: 0.1, ease: 'power2.in' }, t + 0.1);
    tl.to(G.dotB, { scaleX: 1.42, scaleY: 1.82, duration: 0.1, ease: 'power1.out' }, t);
    tl.to(G.dotB, { scaleX: 1.6, scaleY: 1.6, duration: 0.1, ease: 'power1.in' }, t + 0.1);
    tl.set(G.dotB, { scaleX: 2.0, scaleY: 1.28 }, land);
    tl.to(G.dotB, { scaleX: 1.6, scaleY: 1.6, duration: 0.26, ease: 'back.out(3)' }, land);
    tl.set(G.pulse, { opacity: 0.95, scale: 1.6 }, land);
    tl.to(G.pulse, { scale: 4.6, opacity: 0, duration: 0.42, ease: 'power2.out' }, land);
  }

  /* ---------- one power-up: erupt · fall · land+quench · stamp · hop · whip ---------- */
  function powerUp(G) {
    var P0 = G.P0;
    // Scene 1/7 — the problem word erupts from the lava
    eruptWord(G, P0);

    // Scene 2/8 — the app card falls red-hot
    var tF = P0 + 0.4;
    tl.set(G.pos, { autoAlpha: 1 }, tF);
    tl.fromTo(G.fall, { y: -720, rotation: -8 }, { y: 0, rotation: 0, duration: 0.4, ease: 'power1.in' }, tF);
    tl.to(G.trail, { opacity: 0, duration: 0.08, ease: 'power1.out' }, P0 + 0.8);

    // Scene 3/9 — LAND + QUENCH
    var tL = P0 + 0.8;
    tl.set(G.sq, { scaleX: 1.04, scaleY: 0.94 }, tL);
    tl.to(G.sq, { scaleX: 1, scaleY: 1, duration: 0.3, ease: 'back.out(2.2)' }, tL);
    doShake(tL, 10);
    doFlash(tL, 0.5);
    lt.set(L, { erupt: 1, eruptX: 0.5, eruptY: 0.93, heat: 1.3, boost: 2.2, coolX: 0.5, coolY: G.coolY, coolR: 0 }, tL);
    lt.to(L, { erupt: 0, heat: 1, duration: 0.4, ease: 'power2.out' }, tL);
    lt.to(L, { boost: 1, duration: 0.6, ease: 'power2.out' }, tL);
    lt.to(L, { coolR: 0.45, duration: 0.4, ease: 'power2.out' }, tL);
    splash(G, tL);
    tl.to([G.hot, G.rim], { opacity: 0, duration: 0.4, ease: 'power2.out' }, tL);
    steam(G, tL);
    tl.to(G.sheen, { xPercent: 520, duration: 0.36, ease: 'power2.inOut' }, tL + 0.14);
    tl.to(G.molten, { opacity: 0, duration: 0.2, ease: 'power1.out' }, tL);
    tl.to(G.stone, { opacity: 1, duration: 0.2, ease: 'power1.out' }, tL);
    tl.to(G.word, { y: 30, opacity: 0.35, duration: 0.4, ease: 'power2.out' }, tL);

    // Scene 4/10 — the answer stamps where the word was (stone word knocked into the lava)
    var tA = P0 + 1.2;
    tl.to(G.word, { y: 120, scaleY: 0.5, opacity: 0, duration: 0.16, ease: 'power2.in' }, tA);
    tl.fromTo(G.ans, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: 'none' }, tA);
    tl.fromTo(G.ans, { scale: 1.4 }, { scale: 1, duration: 0.3, ease: 'back.out(3)' }, tA);
    flare(G, tA);
    doShake(tA, 6);
    lt.set(L, { flash: 0.12 }, tA);
    lt.to(L, { flash: 0, duration: 0.2, ease: 'power2.out' }, tA);

    // Scene 5/11 — the "toi" dot hops onto the new platform
    hop(G, P0 + 1.6);

    // Scene 6/12 — WHIP-PAN out
    var tW = P0 + 2.0;
    tl.to(G.g, { x: -1800, filter: 'blur(16px)', duration: 0.4, ease: 'power2.in' }, tW);
    lt.to(L, { whip: G.whipTo, coolX: 0.5 - 1800 / 1920, duration: 0.4, ease: 'power2.in' }, tW);
    streaks(tW);
  }

  /* ---------- camera: slow push under each power-up ---------- */
  tl.to(cam, { scale: 1.035, duration: 2.4, ease: 'none' }, 0);
  tl.set(cam, { scale: 1 }, 2.4);
  tl.to(cam, { scale: 1.035, duration: 2.4, ease: 'none' }, 2.4);

  /* ---------- POWER-UP 1 : NAVETTE ---------- */
  powerUp(A);
  // 1.30 — the price pulses; Friday departures light up on the 16ths
  var price = $('price');
  gsap.set(price, { transformOrigin: '100% 50%', textShadow: '0 0 0px rgba(255,106,31,0)' });
  tl.to(price, { scale: 1.25, textShadow: '0 0 26px rgba(255,106,31,1)', duration: 0.04, ease: 'power2.out' }, 1.3);
  tl.to(price, { scale: 1, textShadow: '0 0 0px rgba(255,106,31,0)', duration: 0.36, ease: 'power2.out' }, 1.34);
  ['h14', 'h16', 'h18'].forEach(function (id, i) {
    var s = $(id), t = 1.3 + i * 0.1;
    gsap.set(s, { color: '#ffffff', textShadow: '0 0 0px rgba(255,106,31,0)' });
    tl.to(s, { color: '#ff6a1f', scale: 1.22, textShadow: '0 0 20px rgba(255,106,31,0.95)', duration: 0.05, ease: 'power2.out' }, t);
    tl.to(s, { color: '#ffffff', scale: 1, textShadow: '0 0 0px rgba(255,106,31,0)', duration: 0.26, ease: 'power2.inOut' }, t + 0.12);
  });
  tl.set(A.g, { visibility: 'hidden' }, 2.4);

  /* ---------- POWER-UP 2 : SAC ---------- */
  tl.set(B.g, { autoAlpha: 1 }, 2.4);
  powerUp(B);
  // 3.30–3.90 — BRANDING: the 8 sign columns flash one per 32nd note
  var brands = $('brands'), XS = [102, 183, 263, 344, 424, 504, 585, 666], YS = [92, 202, 313];
  XS.forEach(function (x, c) {
    var tc = 3.3 + c * 0.075;
    YS.forEach(function (y) {
      var lx = (x / 766 * 100) + '%', ly = (y / 431 * 100) + '%';
      var puff = el(brands, '04-navette-sac-puff', 'left:' + lx + ';top:' + ly);
      var glow = el(brands, '04-navette-sac-brand', 'left:' + lx + ';top:' + ly);
      gsap.set(glow, { opacity: 0 });
      gsap.set(puff, { opacity: 0, scale: 0.5 });
      tl.to(glow, { keyframes: [{ opacity: 1, duration: 0.04, ease: 'power2.out' }, { opacity: 0, duration: 0.08, ease: 'power1.in' }] }, tc);
      tl.set(puff, { opacity: 0.5 }, tc);
      tl.to(puff, { scale: 1.6, y: -22, opacity: 0, duration: 0.42, ease: 'power2.out' }, tc);
    });
  });

  draw();
  window.__timelines[FID] = tl;
})();
</script>
