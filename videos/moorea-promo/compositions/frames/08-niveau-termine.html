    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  var ICONS = ['mdiBusSide', 'mdiCancel', 'mdiMapMarker', 'mdiCalendarCheck', 'mdiSilverwareForkKnife', 'mdiCreditCardOutline', 'mdiCompassOutline', 'mdiMessage'];

  LT({ heat: 1.5, duration: 0.6, ease: 'power2.out' }, 1.2);

  function burst(seed, t0, x, y, n, vmin, vmax, lmin, lmax, w) {
    var r = rng(seed), arr = [];
    for (var i = 0; i < n; i++) arr.push({ a: r() * 6.2832, v: vmin + (vmax - vmin) * Math.pow(r(), 0.8), life: lmin + (lmax - lmin) * r(),
      w: (1.2 + r() * 3.4) * w, d: r() * 0.035, k: 2.2 + r() * 2.6, up: 60 + r() * 220, f: r() * 6.28 });
    return { t0: t0, x: x, y: y, p: arr };
  }
  var BURSTS = [
    burst(801, 0.06, 960, 395, 150, 700, 2500, 0.55, 1.3, 1.15),
    burst(802, 0.70, 960, 700, 56, 400, 1400, 0.35, 0.8, 0.85),
    burst(803, 2.25, 1640, 420, 80, 450, 1600, 0.4, 0.95, 0.95),
    burst(804, 2.40, 960, 780, 34, 500, 1500, 0.25, 0.5, 0.7),

        sctx.strokeStyle = 'rgba(255,207,45,' + (a * 0.9).toFixed(3) + ')'; sctx.lineWidth = p.w * 1.3; sctx.stroke();

  function slamIn(el, at, from, dur) {   // arrives from big scale, impact at at+dur, then back.out settle
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.03, ease: 'none' }, at)
      .fromTo(el, { scale: from }, { scale: 0.94, duration: dur, ease: 'power4.in' }, at)
      .to(el, { scale: 1, duration: 0.25, ease: 'back.out(2)' }, at + dur);
  }

  /* ============ Scene 1 (0.00–0.40): DROP — white flash, NIVEAU / TERMINÉ slam, ember explosion ============ */
  tl.fromTo(flash, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: 'power2.out' }, 0);
  var tslam = $('titleslam');
  gsap.set(tslam, { transformOrigin: '960px 395px' });
  slamIn(tslam, 0, 2.4, 0.1);
  tl.fromTo(tslam, { '--gx': 24 }, { '--gx': 0, duration: 0.42, ease: 'power3.out' }, 0);
  shake(0.1, SHAKE_BIG);
  gsap.set($('type'), { transformOrigin: '960px 540px' });
  tl.fromTo($('type'), { scale: 1 }, { scale: 1.035, duration: 0.85, ease: 'none' }, 0.35);   // slow push while 8/8 spins

  /* ============ Scene 2 (0.40–1.20): 8/8 slot reel lands at 0.70 + GALÈRES ÉVITÉES ============ */
  var scorein = $('scorein');
  gsap.set(scorein, { transformOrigin: '960px 700px' });
  tl.fromTo(scorein, { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.12, ease: 'power3.out' }, 0.4);
  tl.fromTo(strip, { y: 0 }, { y: -7 * 280, duration: 0.3, ease: 'back.out(0.9)' }, 0.4);
  tl.fromTo($('vdev'), { attr: { stdDeviation: '0 28' } }, { attr: { stdDeviation: '0 0.01' }, duration: 0.29, ease: 'power2.out' }, 0.4);
  punch(scorein, 0.7, 1.24, 0.3, 'back.out(3)');
  tl.to($('burst8'), { keyframes: [{ opacity: 1, scale: 0.55, duration: 0.001, ease: 'none' }, { opacity: 0, scale: 1.5, duration: 0.45, ease: 'power2.out' }] }, 0.7);
  hit(0.7, 0.22, 0.1);
  var gal = $('galeres');
  gsap.set(gal, { transformOrigin: '960px 27px' });
  tl.fromTo(gal, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: 'none' }, 0.7)
    .fromTo(gal, { letterSpacing: '0.75em', paddingLeft: '0.75em', scale: 1.12 }, { letterSpacing: '0.2em', paddingLeft: '0.2em', scale: 1, duration: 0.3, ease: 'power3.out' }, 0.7);

  /* ============ Scene 3 (1.20–2.40): PULL-BACK over the path of 8 cooled platforms ============ */
  // type -> results lockup in the top band (kept below the HUD's 150 px): [NIVEAU/TERMINÉ] | [8/8 · GALÈRES ÉVITÉES]
  var title = $('title'), score = $('score');
  gsap.set(title, { transformOrigin: '960px 395px' });
  gsap.set(score, { transformOrigin: '960px 738px' });
  tl.to($('type'), { scale: 1, duration: 0.45, ease: 'power4.out' }, 1.2);
  tl.fromTo(title, { x: 0, y: 0, scale: 1 }, { x: -186, y: -155, scale: 0.42, duration: 0.45, ease: 'power4.out' }, 1.2);
  tl.fromTo(score, { x: 0, y: 0, scale: 1 }, { x: 214, y: -498, scale: 0.55, duration: 0.45, ease: 'power4.out' }, 1.2);
  gsap.set($('divider'), { transformOrigin: '50% 50%' });
  tl.fromTo($('divider'), { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: 'power3.out' }, 1.4);
  tl.to($('scrim'), { opacity: 0.45, duration: 0.4, ease: 'power2.out' }, 1.2);

  // camera pull-back over the world
  var world = $('world');
  gsap.set(world, { transformOrigin: '260px 880px' });
  tl.fromTo(world, { scale: 1.5 }, { scale: 1, duration: 0.6, ease: 'power3.out' }, 1.2);

  // trail draws on with the platforms
  tl.fromTo($('mbasep'), { attr: { 'stroke-dashoffset': 1000 } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.36, ease: 'power2.out' }, 1.2);

  // 8 platforms pop in red-hot and cool (1.20–1.48, stagger 0.04)
  PTS.forEach(function (p, i) {
    var at = 1.2 + i * 0.04;
    gsap.set(PW[i], { transformOrigin: '50% 60%' });
    tl.fromTo(PW[i], { scale: 0 }, { scale: 1, duration: 0.2, ease: 'back.out(3)' }, at);
    tl.fromTo(HOT[i], { opacity: 0.95 }, { opacity: 0, duration: 0.34, ease: 'power2.out' }, at + 0.05);
    tl.fromTo(PATCH[i], { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'power3.out' }, at);
    tl.to(STEAM[i], { keyframes: [{ opacity: 0.9, scale: 0.45, duration: 0.001, ease: 'none' }, { opacity: 0, scale: 1.55, duration: 0.34, ease: 'power2.out' }] }, at + 0.03);
  });

  // the goal: festival entrance photo
  var goal = $('goal');
  gsap.set(goal, { transformOrigin: '50% 50%' });
  tl.fromTo(goal, { scale: 0, rotation: -6 }, { scale: 1, rotation: 0, duration: 0.2, ease: 'back.out(2.4)' }, 1.4);
  punch(goal, 1.6, 1.05, 0.2, 'power2.out');
  punch(goal, 2.0, 1.05, 0.2, 'power2.out');

  // the "toi" dot hops platform to platform (1.30, 1.42, ... 8 hops) and lands in the photo at 2.25
  var you = $('you'), youin = $('youin');
  var STAND = PTS.map(function (p) { return [p[0], p[1] - 65]; }).concat([GOAL]);
  var SH0 = '0 14px 28px rgba(0,0,0,0.55),0 0 0px 0px rgba(225,83,17,0)';
  var SH1 = '0 14px 28px rgba(0,0,0,0.55),0 0 30px 5px rgba(225,83,17,0.7)';
  function light(i, at) {
    tl.fromTo(CARD[i], { borderColor: '#22364f', boxShadow: SH0 }, { borderColor: '#e15311', boxShadow: SH1, duration: 0.08, ease: 'power2.out' }, at);
    tl.to(PW[i], { keyframes: [{ y: 9, duration: 0.05, ease: 'power2.out' }, { y: 0, duration: 0.14, ease: 'back.out(3)' }] }, at);
    punch(ICO[i], at, 1.4, 0.2, 'back.out(3)');
  }
  tl.fromTo(youin, { scale: 0 }, { scale: 1, duration: 0.14, ease: 'back.out(3)' }, 1.22);
  light(0, 1.24);
  tl.fromTo($('mdonep'), { attr: { 'stroke-dashoffset': 1000 } }, { attr: { 'stroke-dashoffset': 1000 }, duration: 0.01, ease: 'none' }, 1.2);
  for (var h = 0; h < 8; h++) {
    var a = STAND[h], b = STAND[h + 1], t0 = 1.3 + h * 0.12, d = h === 7 ? 0.11 : 0.12, lift = h === 7 ? 130 : 64;
    var apex = Math.min(a[1], b[1]) - lift, first = h === 0;
    tl.fromTo(you, { x: a[0] }, { x: b[0], duration: d, ease: 'none', immediateRender: first }, t0);
    tl.fromTo(you, { y: a[1] }, { y: apex, duration: d / 2, ease: 'power2.out', immediateRender: first }, t0);
    tl.fromTo(you, { y: apex }, { y: b[1], duration: d / 2, ease: 'power2.in', immediateRender: false }, t0 + d / 2);
    var f0 = h === 0 ? 0 : frac(h), f1 = h === 7 ? 1 : frac(h + 1);
    tl.fromTo($('mdonep'), { attr: { 'stroke-dashoffset': 1000 * (1 - f0) } }, { attr: { 'stroke-dashoffset': 1000 * (1 - f1) }, duration: d, ease: 'none', immediateRender: false }, t0);
    tl.to(youin, { keyframes: [{ scaleX: 1.32, scaleY: 0.72, duration: 0.001, ease: 'none' }, { scaleX: 1, scaleY: 1, duration: 0.1, ease: 'back.out(3)' }] }, t0 + d);
    if (h < 7) light(h + 1, t0 + d);
  }

  // GOAL at 2.25: burst rings, photo flash, sparks, lava quench ring opens around the festival
  var G = 2.25;
  [['ringA', 0.2, 2.6, 0.5], ['ringB', 0.2, 3.4, 0.55], ['ringC', 0.4, 4.2, 0.4]].forEach(function (r, i) {
    gsap.set($(r[0]), { transformOrigin: '50% 50%' });
    tl.to($(r[0]), { keyframes: [{ opacity: 1, scale: r[1], duration: 0.001, ease: 'none' }, { opacity: 0, scale: r[2], duration: r[3], ease: 'power2.out' }] }, G + i * 0.05);
  });
  tl.to($('goalflash'), { keyframes: [{ opacity: 0.85, duration: 0.001, ease: 'none' }, { opacity: 0, duration: 0.3, ease: 'power2.out' }] }, G);
  punch(goal, G, 1.12, 0.3, 'back.out(3)');

  /* ============ Scene 4 (2.40–3.20): TOUT LE FESTIVAL. / UNE SEULE APPLI. ============ */
  tl.fromTo($('tagscrim'), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: 'power2.out' }, 2.3);
  var tag1 = $('tag1'), tag2 = $('tag2');
  gsap.set([tag1, tag2], { transformOrigin: '50% 50%' });
  slamIn(tag1, 2.32, 2.3, 0.08);          // impact on 2.40
  hit(2.4, 0.45, 0.12); shake(2.4, SHAKE_MED);
  slamIn(tag2, 2.72, 2.3, 0.08);          // impact on 2.80
  hit(2.8, 0.45, 0.12); shake(2.8, SHAKE_MED);
  tl.to(world, { scale: 1.035, duration: 0.8, ease: 'none' }, 2.4);       // slow push while the taglines hold
  // the goal keeps beating on the grid
  tl.to($('ringC'), { keyframes: [{ opacity: 0.9, scale: 0.5, duration: 0.001, ease: 'none' }, { opacity: 0, scale: 3.2, duration: 0.4, ease: 'power2.out' }] }, 2.8);
  punch(goal, 2.8, 1.05, 0.2, 'power2.out');
  punch(youin, 3.0, 1.35, 0.2, 'back.out(3)');

  draw(); drawSparks();
})();
</script>
</template>
