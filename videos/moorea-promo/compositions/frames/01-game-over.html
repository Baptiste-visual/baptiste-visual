  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a);

  // S.u = local clock (drives lava time, ember time and the zoom push); the rest are tweened params.
  var S = { u: 0, heat: 1, flash: 0, erupt: 0, punch: 0, boost: 1 };
  var P = { t: FRAME_START, heat: 1, zoom: 1.25, panX: 0, panY: 0, tilt: 0.25, horizon: -0.45,

  function rewindK(u) { var k = Math.min(1, Math.max(0, (u - 2.4) / 0.8)); return 0.5 * k + 0.5 * k * k; }
  // lava: forward 0 -> 2.4, then runs BACKWARDS 2.4 -> 0.8 (accelerating); embers: forward, then fall (rise -3 equivalent)
  function lavaT(u) { return FRAME_START + (u <= 2.4 ? u : 2.4 - 1.6 * rewindK(u)); }
  function emberT(u) { return FRAME_START + (u <= 2.4 ? u : 2.4 - 2.4 * rewindK(u)); }
  function draw() {
    P.t = lavaT(S.u); P.heat = S.heat; P.flash = S.flash; P.erupt = S.erupt;
