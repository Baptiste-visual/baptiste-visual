  tl.fromTo($('hint'), { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.2, ease: 'power2.out' }, 1.7);
  gsap.set(A, { transformOrigin: '50% 55%' });
  tl.fromTo(A, { scale: 1 }, { scale: 1.03, duration: 1.6, ease: 'none' }, 0.4);   // macro push underneath

  /* Scene 6 (2.00–2.40): WHIP-PAN out — directional blur + light streaks, lava rushes */
  tl.to(A, { x: 40, duration: 0.08, ease: 'power2.out' }, 2.0)
    .to(A, { x: -2300, duration: 0.28, ease: 'power3.in' }, 2.08)
    .set(A, { filter: 'url(#' + ID + '-whipblur)' }, 2.1)
    .fromTo($('whipdev'), { attr: { stdDeviation: '0 0' } }, { attr: { stdDeviation: '80 0' }, duration: 0.26, ease: 'power2.in', immediateRender: false }, 2.1);
  tl.fromTo(streaks, { x: 1900 }, { x: -2100, duration: 0.42, ease: 'power1.in' }, 2.08)
    .fromTo(streaks, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: 'none', immediateRender: false }, 2.1)
    .to(streaks, { opacity: 0, duration: 0.1, ease: 'none' }, 2.42);
  tl.to($('scrim'), { opacity: 0.5, duration: 0.3, ease: 'power1.inOut' }, 2.2);

  /* Scene 7 (2.40–2.80): 1000 QUESTIONS erupts; 40 "?" pop on 32nds and orbit */
  erupt($('probB'), 2.4);
  hit(2.4, 0.22);
  var CX = 960, CY = 500, RX = 860, RY = 318, SX = 1376, SY = 880;
  function orb(q, t) { var a = q.a0 + q.w * (t - 2.4); return { x: CX + Math.cos(a) * RX * q.r, y: CY + Math.sin(a) * RY * q.r }; }
  QS.forEach(function (q, i) {
    var p0 = orb(q, 2.4);
    gsap.set(q.o, { x: p0.x, y: p0.y });
    gsap.set(q.s, { rotation: q.rot });
    tl.fromTo(q.s, { scale: 0 }, { scale: 1, duration: 0.15, ease: 'back.out(3)' }, 2.4 + (i % 8) * 0.05);
    var tEnd = 3.4 + q.d, N = 10, kf = [];
    for (var k = 1; k <= N; k++) { var p = orb(q, 2.4 + (tEnd - 2.4) * k / N); kf.push({ x: p.x, y: p.y, duration: (tEnd - 2.4) / N, ease: 'none' }); }
    tl.to(q.o, { keyframes: kf }, 2.4);
    /* Scene 9: sucked into the send button 3.40–3.60 */
    tl.to(q.o, { x: SX, duration: 0.14, ease: 'power2.in' }, tEnd)
      .to(q.o, { y: SY, duration: 0.14, ease: 'power3.in' }, tEnd)
      .to(q.o, { scale: 0.2, duration: 0.14, ease: 'power2.in' }, tEnd)
      .set(q.o, { autoAlpha: 0 }, tEnd + 0.14);
  });
  gsap.set(B, { transformOrigin: '50% 50%' });
  tl.fromTo(B, { scale: 1 }, { scale: 1.02, duration: 1.8, ease: 'none' }, 2.4);

  /* Scene 8 (2.60–3.40): input slides up, the question types in (1 char / 0.017 s), send pressed */
  var inwrap = $('inwrap');
  gsap.set(inwrap, { scale: 1.12, transformOrigin: '50% 50%' });
  tl.fromTo(inwrap, { y: 300, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.26, ease: 'back.out(1.3)' }, 2.6);
  tl.set($('phold'), { display: 'none' }, 2.8)
    .set($('ph'), { attr: { 'class': 'ph typed' } }, 2.8)
    .set($('caret'), { opacity: 1 }, 2.8)
    .set($('caret'), { opacity: 0 }, 3.4)
    /* sent: the field empties back to its placeholder (the question went into the send button) */
    .set($('phtext'), { display: 'none' }, 3.44)
    .set($('phold'), { display: 'inline' }, 3.44)
    .set($('ph'), { attr: { 'class': 'ph' } }, 3.44);
  CH.forEach(function (cs, j) { tl.set(cs, { display: 'inline' }, 2.8 + j * 0.017); });
  gsap.set([$('ring0'), $('ring1')], { x: 756, y: 19 });
  tl.fromTo($('send'), { scale: 0.85 }, { scale: 1, duration: 0.22, ease: 'back.out(3)', immediateRender: false }, 3.4);
  tl.fromTo($('ring0'), { scale: 1, opacity: 0.95 }, { scale: 1.9, opacity: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, 3.4);

  /* Scene 9 (3.40–4.20): M.A.N.A header, answer bubble, chips on 16ths, warning */
  tl.fromTo($('mhead'), { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.18, ease: 'back.out(2)' }, 3.4);
  tl.fromTo($('ring1'), { scale: 1, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, 3.6);
  var bubble = $('bubble');
  gsap.set(bubble, { transformOrigin: '0% 100%' });
  tl.fromTo(bubble, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.04, ease: 'none' }, 3.6)
    .fromTo(bubble, { scale: 0.6 }, { scale: 1.04, duration: 0.12, ease: 'power2.out' }, 3.6)
    .to(bubble, { scale: 1, duration: 0.12, ease: 'power2.inOut' }, 3.72);
  [0, 1, 2, 3].forEach(function (n) { pop($('chip' + n), 3.8 + n * 0.1, 1, 0.18, 'back.out(3)'); });
  tl.fromTo($('bscrim'), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, ease: 'power1.out' }, 3.5);
  tl.fromTo($('warn'), { y: 12, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.18, ease: 'power2.out' }, 3.9);

  /* Scene 10 (3.60–4.20): M.A.N.A RÉPOND. stamps; the stone word sinks */
  petrify($('probB'), $('probB-hot'), $('probB-stone'), 3.6);
  stamp($('ansB'), 3.6, 110);
  hit(3.6, 0.3);
  shake(B, 3.6, 8);

  /* Scene 11 (4.20–4.80): riser — everything vibrates on 32nds, white-out into the drop */
  var vib = [4, -4, 3, -4, 4, -3, 4, -4, 3, -4, 4, -4];
  vib.forEach(function (v, j) { tl.set(stage, { x: v, y: (j % 2 ? 1.5 : -1.5) }, 4.2 + j * 0.05); });
  gsap.set(stage, { transformOrigin: '50% 50%' });
  tl.fromTo(stage, { scale: 1 }, { scale: 1.04, duration: 0.6, ease: 'power2.in', immediateRender: false }, 4.2);
  tl.fromTo(flash, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power2.in', immediateRender: false }, 4.55);

  draw();
})();
