<script>
(function () {
  var FID = '02-rejouer', FRAME_START = 3.2, DUR = 1.6;
  function $(id) { return document.getElementById(FID + '-' + id); }
  var crt = $('crt');
  var root = (crt && crt.closest('[data-composition-id="' + FID + '"]')) || document;
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  /* ---------- deterministic helpers ---------- */
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rnd = mulberry(2032);
  function R(a, b) { return a + (b - a) * rnd(); }
  function el(parent, cls, css) { var d = document.createElement('div'); d.className = cls; if (css) d.style.cssText = css; parent.appendChild(d); return d; }

  /* ---------- markup completion ---------- */
  MUI.hydrate(root);

  /* ---------- sparse embers (same seed as frame 01, GLOBAL time -> continuous across the cut) ---------- */
  var emb = MooreaEmbers.create($('embers'), { seed: 11, count: 30 });
  var S = { u: 0, boost: 1 };
  function draw() { emb.render(FRAME_START + S.u, { boost: S.boost }); }
  // function-setter proxy: GSAP calls these on every render (seek-safe, independent of suppressEvents)
  var L = {};
  Object.keys(S).forEach(function (k) {
    L[k] = function (v) { if (arguments.length) { S[k] = v; return; } return S[k]; };
  });
  // param tweens live in `lt`, bracketed by two redraw tweens -> one draw per render, after params update
  var lt = gsap.timeline({ defaults: { lazy: false } });
  var DR = { a: 0, b: 0 };
  var DP = {
    a: function (v) { if (arguments.length) { if (v < DR.a) draw(); DR.a = v; return; } return DR.a; },
    b: function (v) { if (arguments.length) { if (v > DR.b) draw(); DR.b = v; return; } return DR.b; }
  };
  tl.to(DP, { a: DUR, duration: DUR, ease: 'none', lazy: false }, 0);
  tl.add(lt, 0);
  tl.to(DP, { b: DUR, duration: DUR, ease: 'none', lazy: false }, 0);
  function LT(prop, from, to, at, dur, ease) {
    var a = {}, b = { duration: dur, ease: ease || 'none', immediateRender: false };
    a[prop] = from; b[prop] = to; lt.fromTo(L, a, b, at);
  }
  LT('u', 0, DUR, 0, DUR, 'none');

  /* ---------- elements ---------- */
  var bg = $('bg'), embers = $('embers'), shake = $('shake'), cam = $('cam');
  var titleW = $('title'), titleTx = $('titletx'), q = $('q');
  var words = $('sub').querySelectorAll('[class~="02-rejouer-w"]');
  var btnW = $('btnw'), glow = $('glow'), white = $('white'), sheen = $('sheen'), lbl = $('lbl');
  var ring = $('ring'), ring2 = $('ring2'), sparkHost = $('sparks'), pool = $('pool');
  var chevL = $('chevl'), chevLi = $('chevli'), chevR = $('chevr'), chevRi = $('chevri');
  var scan = $('scan'), crtWhite = $('crtwhite'), beam = $('beam');
  var speed = $('speed'), fOrange = $('forange'), fWhite = $('fwhite');

  function doShake(t, a, dur) {
    var d = (dur || 0.3) / 6;
    tl.to(shake, { keyframes: [
      { x: a, y: -0.75 * a, duration: d }, { x: -0.9 * a, y: 0.85 * a, duration: d },
      { x: 0.7 * a, y: -0.55 * a, duration: d }, { x: -0.45 * a, y: 0.35 * a, duration: d },
      { x: 0.2 * a, y: -0.15 * a, duration: d }, { x: 0, y: 0, duration: d } ], ease: 'none' }, t);
  }

  /* ================= Scene 1 (0.00-0.40): CRT ON — REJOUER ? ================= */
  // the screen opens from a white-hot line (frame 01 ended on the CRT-off line/dot)
  tl.fromTo([bg, embers, crt], { scaleY: 0.008 }, { scaleY: 1, duration: 0.12, ease: 'power4.out' }, 0);
  tl.fromTo(beam, { opacity: 1, scaleY: 1 }, { opacity: 0, scaleY: 3, duration: 0.066, ease: 'power1.in' }, 0);
  tl.fromTo(crtWhite, { opacity: 1 }, { opacity: 0, duration: 0.14, ease: 'power2.out' }, 0.02);
  tl.fromTo(scan, { opacity: 0.75 }, { opacity: 0.4, duration: 0.4, ease: 'none' }, 0);
  tl.set(scan, { opacity: 0 }, 0.40);
  // slam/stamp on the downbeat: scale 1.4 -> 1 back.out(3), tracking 0.3em -> 0.035em, RGB split decays
  tl.fromTo(titleW, { scale: 1.4 }, { scale: 1, duration: 0.3, ease: 'back.out(3)' }, 0);
  // .fx-rgb chromatic split (kit recipe), decaying to fully transparent so nothing sits under the settled glyphs
  tl.fromTo(titleTx, { textShadow: '16px 0px 0px rgba(255,30,60,0.85), -16px 0px 0px rgba(30,220,255,0.85)' },
    { textShadow: '0px 0px 0px rgba(255,30,60,0), 0px 0px 0px rgba(30,220,255,0)', duration: 0.3, ease: 'power3.out' }, 0);
  doShake(0, 10, 0.3);
  LT('boost', 2.4, 1, 0, 0.4, 'power2.out');
  // the "?" kicks on the 8th
  tl.fromTo(q, { rotation: 0, y: 0 }, { rotation: -16, y: -14, duration: 0.05, ease: 'power2.out', immediateRender: false }, 0.20);
  tl.fromTo(q, { rotation: -16, y: -14 }, { rotation: 0, y: 0, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, 0.25);

  /* ================= Scene 2 (0.40-0.80): subline + the app's button ================= */
  tl.fromTo(words, { yPercent: 115, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.24, ease: 'power3.out', stagger: 0.06 }, 0.40);
  // pop 0 -> ~1.1 -> 1
  tl.fromTo(btnW, { scale: 0 }, { scale: 1, duration: 0.26, ease: 'back.out(1.8)' }, 0.40);
  tl.fromTo(pool, { scale: 0.45, opacity: 0 }, { scale: 1, opacity: 0.8, duration: 0.3, ease: 'power3.out' }, 0.40);
  // menu cursor chevrons slide in, then bounce toward the button on the 8ths
  tl.fromTo(chevL, { x: -90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.18, ease: 'power3.out' }, 0.40);
  tl.fromTo(chevR, { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.18, ease: 'power3.out' }, 0.40);
  function nudge(t, amt, back) {
    tl.fromTo(chevLi, { x: amt }, { x: 0, duration: back, ease: 'power2.out', immediateRender: false }, t);
    tl.fromTo(chevRi, { x: -amt }, { x: 0, duration: back, ease: 'power2.out', immediateRender: false }, t);
  }
  nudge(0.60, 16, 0.18);
  // light sweeps across the button
  tl.fromTo(sheen, { xPercent: -150, skewX: -18 }, { xPercent: 560, skewX: -18, duration: 0.3, ease: 'power2.inOut' }, 0.58);

  /* ================= Scene 3 (0.80-1.20): PRESS ================= */
  tl.fromTo(btnW, { scale: 1 }, { scale: 0.92, duration: 0.06, ease: 'power2.out', immediateRender: false }, 0.80);
  tl.fromTo(btnW, { scale: 0.92 }, { scale: 1.06, duration: 0.08, ease: 'power2.out', immediateRender: false }, 0.86);
  tl.fromTo(btnW, { scale: 1.06 }, { scale: 1, duration: 0.24, ease: 'back.out(3)', immediateRender: false }, 0.94);
  // shockwave rings off the button outline
  tl.fromTo(ring, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: 'none' }, 0.80);
  // the outline grows outward by a uniform offset (constant 6 px stroke, stays a ring on screen)
  tl.fromTo(ring, { attr: { x: 580, y: 644, width: 760, height: 112, rx: 30 } },
    { attr: { x: 300, y: 364, width: 1320, height: 672, rx: 310 }, duration: 0.4, ease: 'power2.out' }, 0.80);
  tl.to(ring, { opacity: 0, duration: 0.36, ease: 'none' }, 0.81);
  tl.fromTo(ring2, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: 'none' }, 0.84);
  tl.fromTo(ring2, { attr: { x: 580, y: 644, width: 760, height: 112, rx: 30 } },
    { attr: { x: 410, y: 474, width: 1100, height: 452, rx: 200 }, duration: 0.34, ease: 'power3.out' }, 0.84);
  tl.to(ring2, { opacity: 0, duration: 0.3, ease: 'none' }, 0.85);
  // glow doubles, label flashes white
  tl.fromTo(glow, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: 'power2.out' }, 0.80);
  tl.to(glow, { opacity: 0.8, duration: 0.3, ease: 'power2.out' }, 0.85);
  tl.fromTo(white, { opacity: 0 }, { opacity: 0.85, duration: 0.03, ease: 'none' }, 0.80);
  tl.to(white, { opacity: 0, duration: 0.24, ease: 'power2.out' }, 0.83);
  tl.fromTo(lbl, { textShadow: '0 0 0px rgba(255,255,255,0), 0 0 0px rgba(255,255,255,0)' },
    { textShadow: '0 0 26px rgba(255,255,255,1), 0 0 8px rgba(255,255,255,1)', duration: 0.04, ease: 'none' }, 0.80);
  tl.to(lbl, { textShadow: '0 0 16px rgba(255,255,255,0.6), 0 0 4px rgba(255,255,255,0.5)', duration: 0.3, ease: 'power2.out' }, 0.84);
  // light pool kicks
  tl.fromTo(pool, { scale: 1, opacity: 0.8 }, { scale: 1.2, opacity: 1, duration: 0.07, ease: 'power2.out', immediateRender: false }, 0.80);
  tl.fromTo(pool, { scale: 1.2 }, { scale: 1.06, duration: 0.33, ease: 'power2.out', immediateRender: false }, 0.87);
  // chevrons slam in on the press, bounce again on the 8th
  nudge(0.80, 30, 0.18);
  nudge(1.00, 14, 0.18);
  doShake(0.80, 8, 0.24);
  LT('boost', 1, 2.8, 0.80, 0.05, 'power2.out');
  LT('boost', 2.8, 1.4, 0.85, 0.35, 'power2.out');
  // power-up sparks thrown off the button edge
  for (var i = 0; i < 18; i++) {
    var a = (i / 18) * Math.PI * 2 + R(-0.14, 0.14), ca = Math.cos(a), sa = Math.sin(a);
    var sx = 960 + ca * R(372, 392), sy = 700 + sa * R(52, 60);
    var len = R(26, 58), dist = R(150, 330), dx = ca * dist, dy = sa * dist * 1.15;
    var deg = Math.atan2(dy, dx) * 180 / Math.PI, d = R(0.3, 0.4);
    var sp = el(sparkHost, '02-rejouer-spark', 'left:' + (sx - len / 2).toFixed(1) + 'px;top:' + (sy - 2).toFixed(1) + 'px;width:' + len.toFixed(1) + 'px');
    tl.fromTo(sp, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: 'none' }, 0.80);
    tl.fromTo(sp, { x: 0, y: 0, rotation: deg }, { x: dx, y: dy, rotation: deg, duration: d, ease: 'power3.out' }, 0.80);
    tl.fromTo(sp, { scaleX: 0.3 }, { scaleX: 1.5, duration: 0.1, ease: 'power2.out' }, 0.80);
    tl.to(sp, { scaleX: 0.15, opacity: 0, duration: d - 0.1, ease: 'power2.in' }, 0.90);
  }
  // second, faster light sweep on the 8th (charged)
  tl.fromTo(sheen, { xPercent: -150, skewX: -18 }, { xPercent: 560, skewX: -18, duration: 0.18, ease: 'power2.in', immediateRender: false }, 1.00);

  /* ================= Scene 4 (1.20-1.60): zoom-through INTO the button ================= */
  // slow push toward the button underneath Scenes 2-3, then the dive
  tl.fromTo(cam, { scale: 1 }, { scale: 1.04, duration: 0.8, ease: 'none' }, 0.40);
  tl.fromTo(cam, { scale: 1.04, filter: 'blur(0px)' }, { scale: 7, filter: 'blur(18px)', duration: 0.4, ease: 'power2.in', immediateRender: false }, 1.20);
  tl.fromTo(embers, { scale: 1 }, { scale: 2.3, duration: 0.4, ease: 'power2.in', immediateRender: false }, 1.20);
