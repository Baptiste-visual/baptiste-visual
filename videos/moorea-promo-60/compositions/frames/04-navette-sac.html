  function spray(host, t, n, x0, x1, y0, upMin, upMax) {
    for (var i = 0; i < n; i++) {
      var x = R(x0, x1), sz = R(8, 20), side = x < 960 ? -1 : 1;
      var d = el(host, '04-navette-sac-drop', 'left:' + (x - sz / 2) + 'px;top:' + (y0 - sz / 2) + 'px;width:' + sz + 'px;height:' + sz + 'px');
      var dx = side * R(30, 220), up = R(upMin, upMax), tu = R(0.14, 0.22), td = R(0.24, 0.36), ts = t + R(0, 0.08);
      gsap.set(d, { opacity: 0 });
      tl.set(d, { opacity: 1 }, ts);
      tl.to(d, { x: dx, duration: tu + td, ease: 'none' }, ts);
      tl.to(d, { y: -up, duration: tu, ease: 'power2.out' }, ts);
      tl.to(d, { y: -up + R(200, 320), duration: td, ease: 'power2.in' }, ts + tu);
      tl.to(d, { opacity: 0, scale: 0.4, duration: 0.12, ease: 'power1.in' }, ts + tu + td - 0.12);
    }
  }

  function flare(G, t) {
    var f = el(G.fx, '04-navette-sac-flare', 'left:210px;top:222px;width:1500px;height:12px');
    gsap.set(f, { scaleX: 0, opacity: 0 });
    tl.set(f, { opacity: 1 }, t);
    tl.to(f, { scaleX: 1, duration: 0.18, ease: 'power3.out' }, t);
    tl.to(f, { opacity: 0, scaleY: 0.3, duration: 0.3, ease: 'power2.in' }, t + 0.06);
  }

  function splash(G, t) {
    // landing shock ring on the lava at the card's foot
    var ring = el(G.fx, '04-navette-sac-ring', 'left:' + (960 - 760) + 'px;top:' + (G.bottom - 70) + 'px;width:1520px;height:150px');
    gsap.set(ring, { scale: 0.3, opacity: 0 });
    tl.set(ring, { opacity: 1 }, t);
    tl.to(ring, { scale: 1.08, duration: 0.5, ease: 'power3.out' }, t);
    tl.to(ring, { opacity: 0, duration: 0.45, ease: 'power2.in' }, t + 0.05);
    // molten pool glow under the card (stays, cools down)
    var pool = el(G.fx, '04-navette-sac-pool', 'left:' + (960 - 720) + 'px;top:' + (G.bottom - 110) + 'px;width:1440px;height:220px');
    gsap.set(pool, { opacity: 0 });
    tl.to(pool, { opacity: 1, duration: 0.05 }, t);
    tl.to(pool, { opacity: 0.4, duration: 0.8, ease: 'power2.out' }, t + 0.1);
    // molten droplets flung from both bottom corners
    for (var i = 0; i < 18; i++) {
      var side = i % 2 ? 1 : -1;
      var x0 = side < 0 ? R(G.left - 30, G.left + 110) : R(G.right - 110, G.right + 30);
      var y0 = G.bottom - R(10, 60), sz = R(10, 26);
      var d = el(G.fx, '04-navette-sac-drop', 'left:' + (x0 - sz / 2) + 'px;top:' + (y0 - sz / 2) + 'px;width:' + sz + 'px;height:' + sz + 'px');
      var dx = side * R(90, 420), up = R(140, 400), tu = R(0.16, 0.26), td = R(0.26, 0.4), ts = t + R(0, 0.06);
      gsap.set(d, { opacity: 0 });
      tl.set(d, { opacity: 1 }, ts);
      tl.to(d, { x: dx, duration: tu + td, ease: 'none' }, ts);
      tl.to(d, { y: -up, duration: tu, ease: 'power2.out' }, ts);
      tl.to(d, { y: -up + R(220, 380), duration: td, ease: 'power2.in' }, ts + tu);
      tl.to(d, { opacity: 0, scale: 0.4, duration: 0.14, ease: 'power1.in' }, ts + tu + td - 0.14);
    }
  }

  function steam(G, t) {
    for (var i = 0; i < 12; i++) {
      var x, y, sz = R(130, 210), rise;
      if (i < 7) { x = R(G.left + 60, G.right - 60); y = G.top + 14; rise = R(60, 95); sz = R(110, 160); }
      else { x = i % 2 ? G.left - R(0, 30) : G.right + R(0, 30); y = R(G.top + 60, G.bottom - 120); rise = R(90, 150); }
      var p = el(G.fx, '04-navette-sac-steam', 'left:' + (x - sz / 2) + 'px;top:' + (y - sz / 2) + 'px;width:' + sz + 'px;height:' + sz + 'px');
      gsap.set(p, { opacity: 0, scale: 0.5 });
      var ts = t + R(0, 0.22);
      tl.to(p, { keyframes: [
        { opacity: 0.6, scale: 1, y: -rise * 0.35, duration: 0.14, ease: 'power1.out' },
        { opacity: 0, scale: 1.5, y: -rise, duration: 0.5, ease: 'power1.out' } ] }, ts);
    }
  }

  function streaks(t, len) {
    var host = $('streaks');
    for (var i = 0; i < 9; i++) {
      var h = R(2, 6), w = R(380, 820), y = R(170, 960);
      var s = el(host, '04-navette-sac-streak', 'top:' + y + 'px;width:' + w + 'px;height:' + h + 'px');
      gsap.set(s, { x: 1960, opacity: 0 });
      var ts = t + 0.12 + i * 0.03, dur = Math.min(R(0.2, 0.28), t + len - ts);
      tl.set(s, { opacity: R(0.45, 0.9) }, ts);
      tl.to(s, { x: -w - 80, duration: dur, ease: 'power1.in' }, ts);
    }
  }

  // the orange "toi" dot jumps in from the bottom-left on a parabola (one beat of air time) and lands on the card's top edge
  function hop(G, t, dur) {
    var half = dur / 2, land = t + dur, landY = G.top + G.dotSink;
    tl.fromTo(G.dot, { x: -60 }, { x: G.dotX, duration: dur, ease: 'none' }, t);
    tl.fromTo(G.dot, { y: 720 }, { y: 238, duration: half, ease: 'power2.out' }, t);
    tl.to(G.dot, { y: landY, duration: half, ease: 'power2.in' }, t + half);
    tl.to(G.dotB, { scaleX: 1.42, scaleY: 1.82, duration: half, ease: 'power1.out' }, t);
    tl.to(G.dotB, { scaleX: 1.6, scaleY: 1.6, duration: half, ease: 'power1.in' }, t + half);
    tl.set(G.dotB, { scaleX: 2.0, scaleY: 1.28 }, land);
    tl.to(G.dotB, { scaleX: 1.6, scaleY: 1.6, duration: 0.26, ease: 'back.out(3)' }, land);
    tl.set(G.pulse, { opacity: 0.95, scale: 1.6 }, land);
    tl.to(G.pulse, { scale: 4.6, opacity: 0, duration: 0.42, ease: 'power2.out' }, land);
  }

  /* ---------- one power-up: erupt · fall · land+quench · stamp · (showcase) · hop · whip ---------- */
  function powerUp(G) {
    var P0 = G.P0;
    // erupt (P+0) — the problem word bursts from the lava
    eruptWord(G, P0);

    // fall (P+0.5) — the app card drops red-hot
    var tF = P0 + 0.5;
    tl.set(G.pos, { autoAlpha: 1 }, tF);
    tl.fromTo(G.fall, { y: -820, rotation: -8 }, { y: 0, rotation: 0, duration: 0.5, ease: 'power2.in' }, tF);

    // land + quench (P+1.0)
    var tL = P0 + 1.0;
    tl.to(G.trail, { opacity: 0, duration: 0.08, ease: 'power1.out' }, tL);
    tl.set(G.sq, { scaleX: 1.04, scaleY: 0.94 }, tL);
    tl.to(G.sq, { scaleX: 1, scaleY: 1, duration: 0.3, ease: 'back.out(2.2)' }, tL);
    doShake(tL, 10);
    doFlash(tL, 0.5);
    lt.set(L, { erupt: 1, eruptX: 0.5, eruptY: 0.93, heat: 1.3, boost: 2.2, coolX: 0.5, coolY: G.coolY, coolR: 0 }, tL);
    lt.to(L, { erupt: 0, heat: 1, duration: 0.4, ease: 'power2.out' }, tL);
    lt.to(L, { boost: 1, duration: 0.6, ease: 'power2.out' }, tL);
    lt.to(L, { coolR: 0.45, duration: 0.4, ease: 'power2.out' }, tL);
    splash(G, tL);
    tl.to([G.hot, G.rim], { opacity: 0, duration: 0.4, ease: 'power2.out' }, tL);
    steam(G, tL);
    tl.to(G.sheen, { xPercent: 520, duration: 0.36, ease: 'power2.inOut' }, tL + 0.14);
    tl.to(G.molten, { opacity: 0, duration: 0.2, ease: 'power1.out' }, tL);
    tl.to(G.stone, { opacity: 1, duration: 0.2, ease: 'power1.out' }, tL);
    tl.to(G.word, { y: 30, opacity: 0.35, duration: 0.4, ease: 'power2.out' }, tL);

    // answer (P+1.5) — stamps where the word was (stone word knocked into the lava); HUD counter ticks here
    var tA = P0 + 1.5;
    tl.to(G.word, { y: 120, scaleY: 0.5, opacity: 0, duration: 0.16, ease: 'power2.in' }, tA);
    tl.fromTo(G.ans, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: 'none' }, tA);
    tl.fromTo(G.ans, { scale: 1.4 }, { scale: 1, duration: 0.3, ease: 'back.out(3)' }, tA);
    flare(G, tA);
    doShake(tA, 6);
    lt.set(L, { flash: 0.12 }, tA);
    lt.to(L, { flash: 0, duration: 0.2, ease: 'power2.out' }, tA);

    // hop (P+3.5 -> lands P+4.0)
    hop(G, P0 + 3.5, 0.5);

    // whip-pan out (P+4.5 -> P+5.0)
    var tW = P0 + 4.5;
    tl.to(G.g, { x: -1800, filter: 'blur(16px)', duration: 0.5, ease: 'power2.in' }, tW);
    lt.to(L, { whip: G.whipTo, coolX: 0.5 - 1800 / 1920, duration: 0.5, ease: 'power2.in' }, tW);
    streaks(tW, 0.5);
  }

  function flashTime(s, t) {
    tl.to(s, { color: '#ff6a1f', scale: 1.24, textShadow: '0 0 20px rgba(255,106,31,0.95)', duration: 0.05, ease: 'power2.out' }, t);
    tl.to(s, { color: '#ffffff', scale: 1, textShadow: '0 0 0px rgba(255,106,31,0)', duration: 0.3, ease: 'power2.inOut' }, t + 0.12);
  }

  /* ================= POWER-UP 1 : NAVETTE (0 – 5 s) ================= */
  powerUp(A);

  // 1.5 — the price pulses with the stamp
  var price = $('price');
  gsap.set(price, { transformOrigin: '100% 50%', textShadow: '0 0 0px rgba(255,106,31,0)' });
  tl.to(price, { scale: 1.3, textShadow: '0 0 26px rgba(255,106,31,1)', duration: 0.05, ease: 'power2.out' }, 1.5);
  tl.to(price, { scale: 1, textShadow: '0 0 0px rgba(255,106,31,0)', duration: 0.4, ease: 'power2.out' }, 1.55);

  // 2.0 – 4.5 — SHOWCASE: slow camera push on the card
  tl.to(cam, { scale: 1.06, duration: 2.5, ease: 'power1.inOut' }, 2.0);

  ['h14', 'h16', 'h18', 'h15', 'h17', 'r0', 'r1'].forEach(function (id) {
    gsap.set($(id), { color: '#ffffff', textShadow: '0 0 0px rgba(255,106,31,0)' });
  });
  var tints = [$('tint0'), $('tint1')], dates = [$('d0'), $('d1')];
  gsap.set(tints, { opacity: 0, scaleX: 0.97 });
  gsap.set(dates, { color: '#919cab' });
  function lightRow(i, t) {
    tl.to(tints[i], { opacity: 1, scaleX: 1, duration: 0.12, ease: 'power3.out' }, t);
    tl.to(dates[i], { color: '#ffffff', duration: 0.12, ease: 'power2.out' }, t);
  }
  function dimRow(i, t) {
    tl.to(tints[i], { opacity: 0, duration: 0.25, ease: 'power2.out' }, t);
    tl.to(dates[i], { color: '#919cab', duration: 0.25, ease: 'power2.out' }, t);
  }
  // 2.0 Friday line lights, its times flash on the 8ths
  lightRow(0, 2.0);
  flashTime($('h14'), 2.0); flashTime($('h16'), 2.25); flashTime($('h18'), 2.5);
  // 2.5 Saturday line lights
  dimRow(0, 2.5);
  lightRow(1, 2.5);
  flashTime($('h15'), 2.625); flashTime($('h17'), 2.75);
  // 3.0 the return sub-card slides down open under (a); the card grows and its content scrolls up (app scroll)
  dimRow(1, 3.0);
  var viewA = $('viewa'), scrollA = $('scrolla'), routeB = $('routeb');
  gsap.set(routeB, { clipPath: 'inset(0% 0% 100% 0% round 22px)' });
  tl.fromTo(routeB, { y: -26 }, { y: 0, duration: 0.25, ease: 'back.out(1.7)' }, 3.0);
  tl.fromTo(routeB, { clipPath: 'inset(0% 0% 100% 0% round 22px)' }, { clipPath: 'inset(0% 0% 0% 0% round 22px)', duration: 0.25, ease: 'back.out(1.7)', immediateRender: false }, 3.0);
  tl.to(scrollA, { y: -143, duration: 0.3, ease: 'power3.out' }, 3.0);
  tl.fromTo(viewA, { clipPath: 'inset(0px 0px 389px 0px round 37px)' }, { clipPath: 'inset(0px 0px 253px 0px round 37px)', duration: 0.3, ease: 'power3.out', immediateRender: false }, 3.0);
  flashTime($('r0'), 3.125); flashTime($('r1'), 3.25);
  // 3.5 the app's bold line types in under the routes
  var resaChars = split($('resa'));
  gsap.set(resaChars, { opacity: 0 });
  tl.to(resaChars, { opacity: 1, duration: 0.02, ease: 'none', stagger: 0.3 / resaChars.length }, 3.5);
  tl.to(scrollA, { y: -180, duration: 0.3, ease: 'power2.out' }, 3.5);
  tl.fromTo(viewA, { clipPath: 'inset(0px 0px 253px 0px round 37px)' }, { clipPath: 'inset(0px 0px 180px 0px round 37px)', duration: 0.3, ease: 'power2.out', immediateRender: false }, 3.5);

  tl.set(A.g, { visibility: 'hidden' }, 5.0);

  /* ================= POWER-UP 2 : SAC (5 – 10 s) ================= */
  tl.set(cam, { scale: 1, transformOrigin: '960px 540px' }, 5.0);
  tl.set(B.g, { autoAlpha: 1 }, 5.0);
  tl.to(cam, { scale: 1.03, duration: 4.5, ease: 'none' }, 5.0);
  powerUp(B);

  // 6.1 – 6.6 — BRANDING: the 8 sign columns flash one per 32nd note (0.0625 s)
  var brands = $('brands'), XS = [102, 183, 263, 344, 424, 504, 585, 666], YS = [92, 202, 313];
  XS.forEach(function (x, c) {
    var tc = 6.1 + c * 0.0625;
    YS.forEach(function (y) {
      var lx = (x / 766 * 100) + '%', ly = (y / 431 * 100) + '%';
      var puff = el(brands, '04-navette-sac-puff', 'left:' + lx + ';top:' + ly);
      var glow = el(brands, '04-navette-sac-brand', 'left:' + lx + ';top:' + ly);
      gsap.set(glow, { opacity: 0 });
      gsap.set(puff, { opacity: 0, scale: 0.5 });
      tl.to(glow, { keyframes: [{ opacity: 1, duration: 0.04, ease: 'power2.out' }, { opacity: 0, duration: 0.08, ease: 'power1.in' }] }, tc);
      tl.set(puff, { opacity: 0.5 }, tc);
      tl.to(puff, { scale: 1.6, y: -22, opacity: 0, duration: 0.42, ease: 'power2.out' }, tc);
    });
  });

  // 7.0 – 8.8 — SHOWCASE "Appuyer pour zoomer": tap, zoom x2.1 into the grid, pan, zoom back out
  var zoom = $('zoom'), taps = $('taps'), zlabel = $('zlabel');
  var K = 767 / 766, Z = 2.1;                        // displayed px per image px
  gsap.set(zoom, { transformOrigin: '0px 0px', x: 0, y: 0, scale: 1 });
  function view(t, wx, wy, z, dur, ease) {           // show the image window whose top-left is (wx, wy) image px at zoom z
    tl.to(zoom, { x: -z * wx * K, y: -z * wy * K, scale: z, duration: dur, ease: ease }, t);
  }
  // tap ripple on the image (centre of the first window)
  var TX = 220 * K, TY = 132 * K;
  var tap = el(taps, '04-navette-sac-tap', 'left:' + TX + 'px;top:' + TY + 'px');
  var tring = el(taps, '04-navette-sac-tapring', 'left:' + TX + 'px;top:' + TY + 'px');
  gsap.set(tap, { opacity: 0, scale: 0.6 });
  gsap.set(tring, { opacity: 0, scale: 0.4 });
  tl.set(tap, { opacity: 0.95 }, 7.0);
  tl.to(tap, { scale: 1, duration: 0.08, ease: 'power2.out' }, 7.0);
  tl.to(tap, { opacity: 0, scale: 1.3, duration: 0.3, ease: 'power2.in' }, 7.08);
  tl.set(tring, { opacity: 1 }, 7.0);
  tl.to(tring, { scale: 2.6, opacity: 0, duration: 0.45, ease: 'power2.out' }, 7.0);
  gsap.set(zlabel, { color: '#69707a', textShadow: '0 0 0px rgba(255,106,31,0)' });
  tl.to(zlabel, { color: '#ffffff', textShadow: '0 0 16px rgba(255,106,31,0.9)', duration: 0.05, ease: 'power2.out' }, 7.0);
  tl.to(zlabel, { color: '#69707a', textShadow: '0 0 0px rgba(255,106,31,0)', duration: 0.5, ease: 'power2.inOut' }, 7.15);
  // 7.0 top row, left half (BOISSONS · ENGINS PYROTECHNIQUES · ARMES · CASQUES)
  view(7.02, 30, 26, Z, 0.3, 'power3.out');
  view(7.32, 40, 30, Z, 0.18, 'sine.inOut');
  // 7.5 top row, right half (MÉGAPHONES · INSTRUMENTS · VÉLOS ET TROTTINETTES · MATÉRIEL DE CAMPING)
  view(7.5, 390, 26, Z, 0.3, 'power3.inOut');
  view(7.8, 400, 30, Z, 0.2, 'sine.inOut');
  // 8.0 down to the middle row (DRONES · POINTEURS LASERS · … · ANIMAUX), drifting right
  view(8.0, 46, 142, Z, 0.3, 'power3.inOut');
  view(8.3, 104, 146, Z, 0.2, 'sine.inOut');
  // 8.5 back out to the full grid
  view(8.5, 0, 0, 1, 0.3, 'power3.out');

  draw();
  window.__timelines[FID] = tl;
})();
</script>
