<script>
(function () {
  /* 60 s cut: frame starts at 20 s in the film, 120 BPM grid (beat 0.5 s, 8th 0.25 s).
     The whole film's lava flows at 0.8x: L.t = LAVA_START + local * 0.8 (16 -> 24). */
  var ID = '05-plan-planning', FRAME_START = 20, DUR = 10, LAVA_START = 16, LAVA_RATE = 0.8;
  function $(n) { return document.getElementById(ID + '-' + n); }
  var world = $('world');
  function $$(n) { return Array.prototype.slice.call(world.querySelectorAll('[class~="' + ID + '-' + n + '"]')); }

  /* seeded PRNG (mulberry32): deterministic scatter for the sparks */
  function prng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rnd = prng(505);

  /* spark lines for the stage-pill collision (built before hydrate / tweening) */
  var sparkHost = $('sparks'), sparkBars = [], sparkDist = [];
  for (var s = 0; s < 12; s++) {
    var ang = s * 30 + (rnd() - 0.5) * 18, len = 46 + rnd() * 46;
    var spk = document.createElement('div');
    spk.className = ID + '-spk';
    spk.style.transform = 'rotate(' + ang.toFixed(1) + 'deg)';
    var bar = document.createElement('div');
    bar.className = ID + '-spkbar';
    bar.style.width = len.toFixed(0) + 'px';
    spk.appendChild(bar); sparkHost.appendChild(spk);
    sparkBars.push(bar); sparkDist.push(130 + rnd() * 90);
  }

  if (window.MUI) MUI.hydrate(world);

  var tl = gsap.timeline({ paused: true });

  /* ft = first tween on a prop (renders its from-state at build) · ch = chained tween (from = previous end) */
  function ft(el, from, to, at) { return tl.fromTo(el, from, to, at); }
  function ch(el, from, to, at) { to.immediateRender = false; return tl.fromTo(el, from, to, at); }
  /* 0 -> 1 -> 0 envelope: rest value before AND after, so seeking in any direction stays correct */
  function pulse(rise, pw) { return function (p) { if (p <= 0 || p >= 1) return 0; if (p < rise) return p / rise;
    return Math.pow(1 - (p - rise) / (1 - rise), pw || 2); }; }
  function shakeE(n) { return function (p) { return Math.sin(p * Math.PI * 2 * n) * Math.pow(1 - p, 1.4); }; }
  function shake(at, amp, dur) {
    ft(world, { x: 0 }, { x: amp, duration: dur || 0.3, ease: shakeE(4.5), immediateRender: false }, at);
    ft(world, { y: 0 }, { y: -amp * 0.7, duration: dur || 0.3, ease: shakeE(3.5), immediateRender: false }, at);
  }

  /* ---------------- lava world (seed 3, global lava time) ---------------- */
  var lava = { render: function () {} }, emb = { render: function () {} };
  try { if (window.MooreaLava) lava = MooreaLava.create($('lava'), { seed: 3 }); } catch (e) {}
  try { if (window.MooreaEmbers) emb = MooreaEmbers.create($('embers'), { seed: 11, count: 70 }); } catch (e) {}
  var L = { t: LAVA_START, heat: 1, zoom: 1, panX: 0, panY: 0, tilt: 0.55, horizon: 0.16,
            coolR: 0, coolX: 0.5, coolY: 0.62, erupt: 0, eruptX: 0.5, eruptY: 0.3, flash: 0,
            d: 0, w1: 0, w2: 0, boost: 1 };
  function draw() { L.panX = L.d + L.w1 + L.w2; lava.render(L); emb.render(L.t, { boost: L.boost }); }
  function LT(from, to, at) { to.onUpdate = draw; to.immediateRender = false; return tl.fromTo(L, from, to, at); }
  function lavaErupt(at, x, y, dur, amt) {
    LT({ erupt: 0, eruptX: x, eruptY: y }, { erupt: amt || 1, eruptX: x, eruptY: y, duration: dur, ease: pulse(0.1, 1.6) }, at);
  }
  function boost(at, amt, dur) { LT({ boost: 1 }, { boost: amt, duration: dur || 0.5, ease: pulse(0.1, 1.5) }, at); }
  function flashL(at, amt, dur) { LT({ flash: 0 }, { flash: amt, duration: dur || 0.2, ease: pulse(0.12, 2) }, at); }

  /* continuous flow across cuts + slow drift */
  LT({ t: LAVA_START }, { t: LAVA_START + DUR * LAVA_RATE, duration: DUR, ease: 'none' }, 0);
  LT({ d: 0 }, { d: 0.8, duration: DUR, ease: 'none' }, 0);

  /* ---------------- shared motions ---------------- */
  function eruptWord(box, at, lx, ly) {
    ft(box, { y: 120, scaleY: 0.3, opacity: 0, filter: 'blur(12px)' },
            { y: 0, scaleY: 1.15, opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power3.out' }, at);
    ch(box, { scaleY: 1.15 }, { scaleY: 1, duration: 0.16, ease: 'power2.inOut' }, at + 0.2);
    lavaErupt(at, lx, ly, 0.42, 1);
    boost(at, 2.2, 0.5);
  }
  function stoneWord(box, hot, cold, at) {
    ft(cold, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'none' }, at);
    ft(hot, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: 'none', immediateRender: false }, at);
    ch(box, { y: 0, opacity: 1 }, { y: 30, opacity: 0.35, duration: 0.3, ease: 'power2.out' }, at);
  }
  function stampWord(el, at) {
    ft(el, { scale: 1.4 }, { scale: 1, duration: 0.26, ease: 'back.out(3)' }, at);
    ft(el, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: 'none' }, at);
  }
  function whipOut(stage, at) {
    ch(stage, { x: 0, filter: 'blur(0px)' }, { x: -1800, filter: 'blur(16px)', duration: 0.4, ease: 'power2.in' }, at);
  }

  /* ================= Scene 1 (0.00–0.50): "PERDU ?" erupts ================= */
  var stageA = $('stageA');
  eruptWord($('wordA'), 0.0, 0.5, 0.24);

  /* ================= Scene 2 (0.50–1.00): the map rises out of the lava, hot, and cools ================= */
  var map = $('map');
  ft(map, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.02, ease: 'none' }, 0.5);
  ft(map, { y: 520, rotationX: 55, scale: 0.92 }, { y: 0, rotationX: 0, scale: 0.92, duration: 0.45, ease: 'power3.out' }, 0.5);
  ch(map, { scaleY: 0.92 }, { scaleY: 0.895, duration: 0.05, ease: 'power2.out' }, 0.95);
  ch(map, { scaleY: 0.895 }, { scaleY: 0.92, duration: 0.18, ease: 'back.out(3)' }, 1.0);
  ft($('mapimg'), { filter: 'drop-shadow(0px 30px 40px rgba(0,0,0,0.55)) sepia(1) saturate(9) hue-rotate(-42deg) brightness(0.98) contrast(1.4)' },
                  { filter: 'drop-shadow(0px 30px 40px rgba(0,0,0,0.55)) sepia(0) saturate(1) hue-rotate(0deg) brightness(1) contrast(1)',
                    duration: 0.35, ease: 'power2.inOut' }, 0.7);
  ft($('maphot'), { opacity: 0.38 }, { opacity: 0, duration: 0.35, ease: 'power2.out' }, 0.7);
  lavaErupt(0.5, 0.5, 0.95, 0.6, 1);
  boost(0.5, 2.0, 0.6);
  /* 1.00 landing: the problem word turns to stone */
  stoneWord($('wordA'), $('wordA-hot'), $('wordA-stone'), 1.0);
  shake(1.0, 7, 0.25);
  /* gentle drift before the showcase push */
  ft($('persp'), { scale: 1 }, { scale: 1.02, duration: 1.1, ease: 'sine.out' }, 0.9);

  /* ================= Scene 3 (1.00–2.25): pins drop, one per 8th · 1.50 TU TE REPÈRES. ================= */
  var pins = $$('pin'), rips = $$('rip');
  pins.forEach(function (pin, i) {
    var T = 1.0 + i * 0.25;
    ft(pin, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: 'none' }, T - 0.14);
    ft(pin, { y: -140 }, { y: 0, duration: 0.14, ease: 'power2.in' }, T - 0.14);
    ch(pin, { y: 0 }, { y: -16, duration: 0.08, ease: 'power2.out' }, T);
    ch(pin, { y: -16 }, { y: 0, duration: 0.1, ease: 'power2.in' }, T + 0.08);
    ft(pin, { scaleX: 1, scaleY: 1 }, { scaleX: 1.24, scaleY: 0.78, duration: 0.05, ease: 'power2.out', immediateRender: false }, T);
    ch(pin, { scaleX: 1.24, scaleY: 0.78 }, { scaleX: 1, scaleY: 1, duration: 0.2, ease: 'back.out(3)' }, T + 0.05);
    ft(rips[i], { scale: 0.5 }, { scale: 2.1, duration: 0.42, ease: 'power2.out' }, T);
    ft(rips[i], { opacity: 0 }, { opacity: 0.9, duration: 0.42, ease: pulse(0.08, 1.6) }, T);
  });
  stampWord($('ansA'), 1.5);          /* root HUD counter increments here */
  shake(1.5, 6, 0.22);
  boost(1.5, 1.8, 0.4);

  /* ================= Scene 4 (2.00–4.50) SHOWCASE: weather · tap Main Stage · route · ping ================= */
  /* slow camera push on the map, origin on the Main Stage pin */
  ft($('push'), { scale: 1 }, { scale: 1.08, duration: 2.5, ease: 'sine.inOut' }, 2.0);

  /* 2.00 weather chip pops at the map's top-left */
  var wx = $('wx');
  ft(wx, { scale: 0, opacity: 0 }, { scale: 1.6, opacity: 1, duration: 0.1, ease: 'power2.out' }, 2.0);
  ch(wx, { scale: 1.6 }, { scale: 1.4, duration: 0.14, ease: 'power2.inOut' }, 2.1);

  /* 2.50 tap on the red "4" Main Stage pin: ripple, pin grows 1.35, label tag pops above it */
  var ms = pins[3];
  ch(ms, { scaleX: 1, scaleY: 1 }, { scaleX: 0.88, scaleY: 0.88, duration: 0.06, ease: 'power2.in' }, 2.5);
  ch(ms, { scaleX: 0.88, scaleY: 0.88 }, { scaleX: 1.35, scaleY: 1.35, duration: 0.22, ease: 'back.out(3)' }, 2.56);
  ft($('tap'), { scale: 0.3 }, { scale: 1.15, duration: 0.3, ease: 'power2.out' }, 2.5);
  ft($('tap'), { opacity: 0 }, { opacity: 0.8, duration: 0.3, ease: pulse(0.15, 1.6) }, 2.5);
  ft($('tapring'), { scale: 0.8 }, { scale: 2.6, duration: 0.5, ease: 'power2.out' }, 2.5);
  ft($('tapring'), { opacity: 0 }, { opacity: 0.95, duration: 0.5, ease: pulse(0.08, 1.5) }, 2.5);
  var tag = $('tag');
  ft(tag, { scale: 0, opacity: 0, y: 14 }, { scale: 1.12, opacity: 1, y: 0, duration: 0.14, ease: 'power2.out' }, 2.56);
  ch(tag, { scale: 1.12 }, { scale: 1, duration: 0.16, ease: 'power2.inOut' }, 2.7);
  boost(2.5, 1.5, 0.4);

  /* 3.00 the "toi" dot appears and a dashed route draws to the Main Stage pin (0.4 s) */
  var you = $('mapyou');
  ft(you, { scale: 0, opacity: 0 }, { scale: 1.5, opacity: 1, duration: 0.1, ease: 'power2.out' }, 3.0);
  ch(you, { scale: 1.5 }, { scale: 1.25, duration: 0.14, ease: 'power2.inOut' }, 3.1);
  var rmp = $('rmp'), routeP = $('routep'), RL = 0;
  try { RL = rmp.getTotalLength(); } catch (e) {}
  if (!(RL > 10)) RL = 150;
  rmp.setAttribute('stroke-dasharray', (RL + 4).toFixed(1) + ' ' + (RL + 40).toFixed(1));
  ft(rmp, { attr: { 'stroke-dashoffset': RL + 4 } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.4, ease: 'power1.inOut' }, 3.0);
  /* the dots march toward the stage until the whip */
  ft(routeP, { attr: { 'stroke-dashoffset': 0 } }, { attr: { 'stroke-dashoffset': -72 }, duration: 1.5, ease: 'none' }, 3.0);
  /* route reaches the pin: small arrival bump */
  ch(ms, { scaleX: 1.35, scaleY: 1.35 }, { scaleX: 1.5, scaleY: 1.5, duration: 0.08, ease: 'power2.out' }, 3.36);
  ch(ms, { scaleX: 1.5, scaleY: 1.5 }, { scaleX: 1.35, scaleY: 1.35, duration: 0.18, ease: 'power2.inOut' }, 3.44);

  /* 3.50 sonar rings from the dot, one per 8th */
  $$('sonar').forEach(function (r, i) {
    var T = 3.5 + i * 0.25;
    ft(r, { scale: 1 }, { scale: 4, duration: 0.6, ease: 'power2.out' }, T);
    ft(r, { opacity: 0 }, { opacity: 0.75, duration: 0.6, ease: pulse(0.06, 1.3) }, T);
  });
  ch(you, { scale: 1.25 }, { scale: 1.42, duration: 0.07, ease: 'power2.out' }, 3.5);
  ch(you, { scale: 1.42 }, { scale: 1.25, duration: 0.16, ease: 'power2.inOut' }, 3.57);

  /* ================= Scene 5 (4.50–5.00): WHIP-PAN out ================= */
  whipOut(stageA, 4.5);
  LT({ w1: 0 }, { w1: 2.5, duration: 0.4, ease: 'power2.in' }, 4.5);
  LT({ w1: 2.5 }, { w1: 3.0, duration: 0.25, ease: 'power2.out' }, 4.9);

  /* ================= Scene 6 (5.00–5.50): ÇA CLASHE ! + HALO x MAINSTAGE collide at 5.25 ================= */
  var stageB = $('stageB'), camB = $('camB');
  ft(stageB, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, ease: 'none' }, 5.0);
  ft(stageB, { x: 260, filter: 'blur(12px)' }, { x: 0, filter: 'blur(0px)', duration: 0.18, ease: 'power3.out' }, 5.0);
  eruptWord($('wordB'), 5.0, 0.27, 0.34);

  var haloW = $('haloW'), mainW = $('mainW');
  ft(haloW, { x: -540, scaleX: 3.1, scaleY: 2.0 }, { x: 0, scaleX: 2.4, scaleY: 2.4, duration: 0.25, ease: 'power2.in' }, 5.0);
  ft(mainW, { x: 1420, scaleX: 3.1, scaleY: 2.0 }, { x: 0, scaleX: 2.4, scaleY: 2.4, duration: 0.25, ease: 'power2.in' }, 5.0);
  /* 5.25 COLLIDE: squash, sparks, flash, shake */
  ch(haloW, { scaleX: 2.4 }, { scaleX: 1.95, duration: 0.05, ease: 'power2.out' }, 5.25);
  ch(haloW, { scaleX: 1.95 }, { scaleX: 2.4, duration: 0.18, ease: 'back.out(3)' }, 5.3);
  ch(mainW, { scaleX: 2.4 }, { scaleX: 1.95, duration: 0.05, ease: 'power2.out' }, 5.25);
  ch(mainW, { scaleX: 1.95 }, { scaleX: 2.4, duration: 0.18, ease: 'back.out(3)' }, 5.3);
  /* ricochet down and out of frame */
  ch(haloW, { x: 0 }, { x: -440, duration: 0.5, ease: 'power1.out' }, 5.27);
  ft(haloW, { y: 0 }, { y: -110, duration: 0.14, ease: 'power2.out', immediateRender: false }, 5.27);
  ch(haloW, { y: -110 }, { y: 760, duration: 0.38, ease: 'power2.in' }, 5.41);
  ft($('halo'), { rotation: 0 }, { rotation: -160, duration: 0.52, ease: 'power1.in', immediateRender: false }, 5.27);
  ch(mainW, { x: 0 }, { x: 320, duration: 0.5, ease: 'power1.out' }, 5.27);
  ft(mainW, { y: 0 }, { y: -90, duration: 0.14, ease: 'power2.out', immediateRender: false }, 5.27);
  ch(mainW, { y: -90 }, { y: 780, duration: 0.38, ease: 'power2.in' }, 5.41);
  ft($('main'), { rotation: 0 }, { rotation: 135, duration: 0.52, ease: 'power1.in', immediateRender: false }, 5.27);

  sparkBars.forEach(function (b, i) {
    ft(b, { x: 16, scaleX: 0.25 }, { x: sparkDist[i], scaleX: 1, duration: 0.25, ease: 'power3.out' }, 5.25);
    ft(b, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: pulse(0.06, 1.4) }, 5.25);
  });
  ft($('disc'), { scale: 0.2 }, { scale: 1.5, duration: 0.25, ease: 'power2.out' }, 5.25);
  ft($('disc'), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: pulse(0.05, 1.6) }, 5.25);
  ft($('shock'), { scale: 0.3 }, { scale: 2.6, duration: 0.35, ease: 'power2.out' }, 5.25);
  ft($('shock'), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: pulse(0.05, 1.5) }, 5.25);
  ft($('flash'), { opacity: 0 }, { opacity: 0.55, duration: 0.14, ease: pulse(0.12, 2) }, 5.24);
  shake(5.25, 14, 0.3);
  lavaErupt(5.25, 0.27, 0.48, 0.5, 1.1);
  flashL(5.25, 0.22, 0.2);
  boost(5.25, 3.0, 0.6);

  /* ================= Scene 7 (5.50–6.50): Mon planning rises · 6.00 the clash cools · 6.50 TU RATES RIEN. ================= */
  var sheetW = $('sheetw');
  ft(sheetW, { y: 900, scale: 0.84 }, { y: 0, scale: 0.84, duration: 0.36, ease: 'power4.out' }, 5.5);
  $$('row').forEach(function (r, i) {
    ft(r, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: 'power3.out' }, 5.58 + i * 0.06);
  });
  var btnW = $('btnw');
  ft(btnW, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(2.2)' }, 5.7);
  ft(camB, { scale: 1 }, { scale: 1.04, duration: 4.0, ease: 'sine.inOut' }, 5.5);

  stoneWord($('wordB'), $('wordB-hot'), $('wordB-stone'), 6.0);
  stampWord($('ansB'), 6.5);          /* root HUD counter increments here */
  shake(6.5, 6, 0.2);
  boost(6.5, 1.8, 0.4);

  /* ================= Scene 8 (6.75–8.50) SHOWCASE: one tick per beat ================= */
  var fills = Array.prototype.slice.call(sheetW.querySelectorAll('.mui-check .fill'));
  var checks = Array.prototype.slice.call(sheetW.querySelectorAll('.mui-check svg'));
  var tickRings = $$('tickring');
  var odo = $('odocol'), count = $('count');
  var hl = $('hl');
  /* soft highlight lands on each row an 8th before its tick, then slides down */
  ft(hl, { opacity: 0, scaleX: 0.96 }, { opacity: 1, scaleX: 1, duration: 0.14, ease: 'power2.out' }, 6.75);
  ft(hl, { y: 0 }, { y: 170, duration: 0.2, ease: 'power3.inOut', immediateRender: false }, 7.25);
  ch(hl, { y: 170 }, { y: 340, duration: 0.2, ease: 'power3.inOut' }, 7.75);

  [7.0, 7.5, 8.0].forEach(function (T, i) {
    ft(fills[i], { scale: 0 }, { scale: 1.15, duration: 0.09, ease: 'power2.out' }, T);
    ch(fills[i], { scale: 1.15 }, { scale: 1, duration: 0.09, ease: 'power2.in' }, T + 0.09);
    if (checks[i]) {
      ft(checks[i], { scale: 0, rotation: -30 }, { scale: 1.25, rotation: 0, duration: 0.1, ease: 'back.out(3)' }, T + 0.02);
      ch(checks[i], { scale: 1.25 }, { scale: 1, duration: 0.1, ease: 'power2.inOut' }, T + 0.12);
    }
    ft(tickRings[i], { scale: 1 }, { scale: 1.9, duration: 0.35, ease: 'power2.out' }, T);
    ft(tickRings[i], { opacity: 0 }, { opacity: 1, duration: 0.35, ease: pulse(0.08, 1.5) }, T);
    ft(odo, { y: -40 * i }, { y: -40 * (i + 1), duration: 0.16, ease: 'back.out(2)', immediateRender: i === 0 }, T);
    ft(count, { color: '#9aa1ab' }, { color: '#ff6a1f', duration: 0.3, ease: pulse(0.15, 1.5), immediateRender: i === 0 }, T);
    ft(count, { scale: 1 }, { scale: 1.3, duration: 0.24, ease: pulse(0.25, 2), immediateRender: i === 0 }, T);
  });

  /* 7.00 the app line appears under the answer; its number counts with the ticks (1 artiste -> 2, 3 artistes) */
  var line = $('line'), line1 = $('line1'), line2 = $('line2'), ln1 = $('ln1'), ln2 = $('ln2'), lodo = $('lodocol');
  ft(line, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: 'power3.out' }, 7.0);
  ft(ln1, { scale: 1.5 }, { scale: 1, duration: 0.22, ease: 'back.out(3)' }, 7.0);
  ft(line1, { opacity: 1 }, { opacity: 0, duration: 0.04, ease: 'none', immediateRender: false }, 7.5);
  ft(line2, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: 'none' }, 7.5);
  ft(lodo, { y: 0 }, { y: -40, duration: 0.16, ease: 'back.out(2)' }, 7.5);
  ch(lodo, { y: -40 }, { y: -80, duration: 0.16, ease: 'back.out(2)' }, 8.0);
  ft(ln2, { scale: 1 }, { scale: 1.35, duration: 0.24, ease: pulse(0.25, 2) }, 7.5);
  ft(ln2, { scale: 1 }, { scale: 1.35, duration: 0.24, ease: pulse(0.25, 2), immediateRender: false }, 8.0);

  /* 8.50 VALIDER pressed */
  ch(btnW, { scale: 1 }, { scale: 0.94, duration: 0.06, ease: 'power2.in' }, 8.5);
  ch(btnW, { scale: 0.94 }, { scale: 1.04, duration: 0.1, ease: 'power2.out' }, 8.56);
  ch(btnW, { scale: 1.04 }, { scale: 1, duration: 0.14, ease: 'power2.inOut' }, 8.66);
  ft($('flare'), { scale: 1 }, { scale: 1.2, duration: 0.42, ease: 'power2.out' }, 8.5);
  ft($('flare'), { opacity: 0 }, { opacity: 1, duration: 0.42, ease: pulse(0.1, 1.5) }, 8.5);
  ft($('btnflash'), { opacity: 0 }, { opacity: 0.6, duration: 0.2, ease: pulse(0.2, 2) }, 8.5);
  flashL(8.5, 0.12, 0.2);
  boost(8.5, 2.2, 0.5);
  shake(8.5, 4, 0.18);

  /* ================= Scene 9 (8.50–9.50): the dot hops onto the sheet's top edge (lands 9.00) ================= */
  var hop = $('hop');
  ft(hop, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, ease: 'none' }, 8.5);
  ft(hop, { x: -1260 }, { x: 0, duration: 0.5, ease: 'none' }, 8.5);
  ft(hop, { y: 420 }, { y: -6, duration: 0.42, ease: 'power2.out' }, 8.5);
  ch(hop, { y: -6 }, { y: 0, duration: 0.08, ease: 'power2.in' }, 8.92);
  ft(hop, { scaleX: 1.5, scaleY: 1.5 }, { scaleX: 1.9, scaleY: 1.15, duration: 0.05, ease: 'power2.out' }, 9.0);
  ch(hop, { scaleX: 1.9, scaleY: 1.15 }, { scaleX: 1.5, scaleY: 1.5, duration: 0.18, ease: 'back.out(3)' }, 9.05);
  ft($('dust'), { scaleX: 0.6, scaleY: 0.6 }, { scaleX: 2.4, scaleY: 1.2, duration: 0.4, ease: 'power2.out' }, 9.0);
  ft($('dust'), { opacity: 0 }, { opacity: 0.9, duration: 0.4, ease: pulse(0.08, 1.5) }, 9.0);
  /* the sheet gives under the landing */
  ch(sheetW, { y: 0 }, { y: 8, duration: 0.06, ease: 'power2.out' }, 9.0);
  ch(sheetW, { y: 8 }, { y: 0, duration: 0.22, ease: 'back.out(2.5)' }, 9.06);

  /* ================= Scene 10 (9.50–10.00): WHIP-PAN out ================= */
  whipOut(stageB, 9.5);
  LT({ w2: 0 }, { w2: 3.0, duration: 0.5, ease: 'power2.in' }, 9.5);

  draw();
  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
