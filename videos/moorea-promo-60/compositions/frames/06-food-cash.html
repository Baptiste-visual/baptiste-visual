  }
  function stone(wrap, molten, st, t) {
    tl.to(wrap, { y: 30, duration: .3, ease: 'power2.out' }, t);
    tl.fromTo(molten, { opacity: 1 }, { opacity: 0, duration: .14, ease: 'power1.in' }, t);
    tl.fromTo(st, { opacity: 0 }, { opacity: .4, duration: .14, ease: 'power1.out' }, t);
  }
  function stamp(el, burst, t) {
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: .05, ease: 'none' }, t);
    tl.fromTo(el, { scale: 1.4 }, { scale: 1, duration: .3, ease: 'back.out(3)' }, t);
    tl.fromTo(burst, { scale: .5, opacity: .9 }, { scale: 1.5, opacity: 0, duration: .45, ease: 'power2.out', immediateRender: false }, t);
  }
  function hop(xEl, yEl, sEl, dipEl, dip, x0, y0, peak, x1, y1, t, dur) {
    tl.fromTo(xEl, { x: x0 }, { x: x1, duration: dur, ease: 'none' }, t);
    tl.fromTo(yEl, { y: y0 }, { y: peak, duration: dur / 2, ease: 'power2.out' }, t);
    tl.to(yEl, { y: y1, duration: dur / 2, ease: 'power2.in' }, t + dur / 2);
    tl.fromTo(sEl, { scaleX: .82, scaleY: 1.22 }, { scaleX: 1, scaleY: 1, duration: .3, ease: 'power2.out' }, t);
    tl.fromTo(sEl, { scaleX: 1.25, scaleY: .8 }, { scaleX: 1, scaleY: 1, duration: .22, ease: 'back.out(3)', immediateRender: false }, t + dur);
    tl.fromTo(dipEl, { y: 0 }, { y: dip, duration: .06, ease: 'power2.out', immediateRender: false }, t + dur);
    tl.to(dipEl, { y: 0, duration: .2, ease: 'back.out(2)' }, t + dur + .06);
  }
  function whip(layer, t, dist) {
    tl.fromTo(layer, { x: 0, filter: 'blur(0px)' }, { x: -dist, filter: 'blur(16px)', duration: .5, ease: 'power2.in', immediateRender: false }, t);
  }
  var SIGN_OFF = { scale: 1, backgroundColor: 'rgba(10,12,16,0.78)', boxShadow: '0 0 0px 0px rgba(225,83,17,0)' };
  function signPulse(n, t, stay) {
    var s = $('sign' + n);
    tl.fromTo(s, SIGN_OFF, { scale: 1.35, backgroundColor: '#e15311', boxShadow: '0 0 34px 8px rgba(225,83,17,0.85)', duration: .1, ease: 'power2.out', immediateRender: false }, t);
    tl.to(s, { scale: 1, duration: .26, ease: 'back.out(3)' }, t + .1);
    if (!stay) tl.to(s, { backgroundColor: SIGN_OFF.backgroundColor, boxShadow: SIGN_OFF.boxShadow, duration: .3, ease: 'power2.in' }, t + .3);
    tl.fromTo($('ring' + n), { scale: 1, opacity: 1 }, { scale: 2.7, opacity: 0, duration: .45, ease: 'power2.out', immediateRender: false }, t);
  }

  /* ===================== PART 5 — J'AI FAIM ===================== */
  // Scene 1 (0.0–0.5): problem word erupts
  erupt($('w5'), 0);
  shake($('shake5'), 0.02, 8, false);

  // Scene 2 (0.5–1.25): tiles pop on 8ths, then the app's veggie line
  tl.fromTo($('plate'), { scaleX: 0, scaleY: .55 }, { scaleX: 1, scaleY: 1, duration: .16, ease: 'expo.out' }, .44);
  ['t1', 't2', 't3', 't4'].forEach(function (k, i) {
    var at = .5 + .25 * i;
    tl.fromTo($(k), { scale: 0 }, { scale: 1.12, duration: .1, ease: 'power3.out' }, at);
    tl.to($(k), { scale: 1, duration: .12, ease: 'power2.inOut' }, at + .1);
  });
  // 1.0: the row moves up + shrinks to make room for the stack
  tl.fromTo($('tiles'), { y: 0, scale: 1 }, { y: -32, scale: .8, duration: .3, ease: 'power3.out', immediateRender: false }, 1.0);
  tl.fromTo($('veg'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .22, ease: 'power3.out' }, 1.25);

  // Scene 3 (1.0–1.75): food-truck cards slam onto a fanned stack on 8ths
  var CARDS = [{ rot: -3.5, from: -14, dx: -128, dy: -10, land: 1.0 }, { rot: 2.5, from: 12, dx: 128, dy: -6, land: 1.25 },
               { rot: -1.5, from: -10, dx: -54, dy: -3, land: 1.5 }, { rot: 0, from: 7, dx: 0, dy: 0, land: 1.75 }];
  CARDS.forEach(function (c, i) {
    var n = i + 1;
    tl.fromTo($('c' + n), { x: c.dx * 2.2, y: 800, rotation: c.from, scale: 1.3 },
                          { x: c.dx, y: c.dy, rotation: c.rot, scale: 1, duration: .2, ease: 'power4.in' }, c.land - .2);
    tl.fromTo($('c' + n + 'q'), { scaleX: 1.06, scaleY: .9 }, { scaleX: 1, scaleY: 1, duration: .26, ease: 'back.out(2)', immediateRender: false }, c.land);
    tl.fromTo($('c' + n + 'f'), { opacity: .9 }, { opacity: 0, duration: .12, ease: 'none', immediateRender: false }, c.land);
    if (n > 1) tl.fromTo($('c' + (n - 1) + 'd'), { opacity: 0 }, { opacity: .5, duration: .12, ease: 'power1.out', immediateRender: false }, c.land);
    shake($('shake5'), c.land, i === 3 ? 12 : 9, true);
  });

  // 1.5: answer stamps (HUD +1), problem word turns to stone
  stone($('w5'), $('w5m'), $('w5s'), 1.5);
  stamp($('a5'), $('b5'), 1.5);

  // Scene 4 (2.0–3.75) SHOWCASE: the stack spreads into a carousel (cards at 0.5, 24 px gaps, y 712)
  var PITCH = 923 * .5 + 24, CY = 712 - 776, CS = .5 / .72;
  CARDS.forEach(function (c, i) {
    tl.to($('c' + (i + 1)), { x: (i - 1.5) * PITCH, y: CY, rotation: 0, scale: CS, duration: .34, ease: 'power3.out' }, 2.0);
  });
  tl.to($('tiles'), { y: -38, scale: .78, duration: .3, ease: 'power3.out' }, 2.0);
  // one card per beat: focus ×1.12, the others dim to 0.55, its signpost pulses orange; the track scrolls to keep it whole
  var FOCUS = [2.0, 2.5, 3.0, 3.5], TRACK = [30, 10, -10, -30];
  FOCUS.forEach(function (T, i) {
    var n = i + 1;
    tl.to($('stack'), { x: TRACK[i], duration: .3, ease: 'power3.out' }, T);
    tl.set($('c' + n), { zIndex: 2 }, T);
    tl.to($('c' + n + 'q'), { scale: 1.12, duration: .22, ease: 'back.out(2)' }, T);
    tl.to($('c' + n + 'd'), { opacity: 0, duration: .12, ease: 'power1.out' }, T);
    tl.fromTo($('c' + n + 'f'), { opacity: .3 }, { opacity: 0, duration: .14, ease: 'none', immediateRender: false }, T);
    if (i === 0) {
      [2, 3, 4].forEach(function (m) { tl.to($('c' + m + 'd'), { opacity: .45, duration: .15, ease: 'power1.out' }, T); });
    } else {
      tl.to($('c' + i + 'q'), { scale: 1, duration: .2, ease: 'power2.out' }, T);
      tl.to($('c' + i + 'd'), { opacity: .45, duration: .15, ease: 'power1.out' }, T);
    }
    signPulse(n, T + .02, false);
  });

  // Scene 5 (3.5–4.0): the toi dot leaps onto the focused card (lands 4.0), its signpost opens the map
  hop($('d5x'), $('d5y'), $('d5s'), $('c4q'), 18, -80, 640, 330, 1560, 524, 3.5, .5);
  signPulse(4, 4.0, true);

  // Scene 6 (4.5–5.0): whip-pan out
  whip($('p5'), 4.5, 2300);   // the carousel bleeds to the right edge: travel far enough to clear it

  /* ===================== PART 6 — BRACELET À SEC ===================== */
  // Scene 7 (5.0–5.5): problem word erupts
  erupt($('w6'), 5.0);
  shake($('shake6'), 5.02, 8, false);

  // Scene 8 (5.5–6.0): the glow button falls red-hot
  tl.fromTo($('bfall'), { y: -760, rotation: -9, scale: 1.12 }, { y: 0, rotation: 0, scale: 1, duration: .5, ease: 'power2.in' }, 5.5);
  tl.fromTo($('hot'), { opacity: 1 }, { opacity: 0, duration: .4, ease: 'power2.out' }, 6.0);
  tl.fromTo($('rim'), { opacity: 1 }, { opacity: 0, duration: .5, ease: 'power2.out' }, 6.0);

  // Scene 9 (6.0–6.5): LAND + QUENCH
  tl.fromTo($('bsq'), { scaleX: 1.07, scaleY: .84 }, { scaleX: 1, scaleY: 1, duration: .3, ease: 'back.out(2)', immediateRender: false }, 6.0);
  shake($('shake6'), 6.0, 13, false);
  stone($('w6'), $('w6m'), $('w6s'), 6.0);
  // steam burst off the quenched button (seeded)
  var steam = $('steam');
  for (var k = 0; k < 12; k++) {
    var side = k % 3, px, py;
    if (side === 2) { px = rnd() < .5 ? 515 + rnd() * 30 : 1375 + rnd() * 30; py = 400 + rnd() * 140; }
    else { px = 540 + rnd() * 840; py = 380 + rnd() * 24; }
    var pf = document.createElement('div'); pf.className = '06-food-cash-puff';
    pf.style.left = px.toFixed(1) + 'px'; pf.style.top = py.toFixed(1) + 'px';
    steam.appendChild(pf);
    var st = 6.0 + k * .018, sc = 1.4 + rnd() * .9;
    tl.fromTo(pf, { opacity: 0 }, { opacity: .3 + rnd() * .15, duration: .06, ease: 'none' }, st);
    tl.fromTo(pf, { x: 0, y: 0, scale: .4 }, { x: (rnd() - .5) * 70, y: -(90 + rnd() * 90), scale: sc, duration: .6, ease: 'power2.out' }, st);
    tl.to(pf, { opacity: 0, duration: .45, ease: 'power1.in' }, st + .12);
  }
  // pssht-TING: shine sweep across the cooled button
  tl.fromTo($('shine'), { x: 0 }, { x: 1250, duration: .3, ease: 'power2.inOut' }, 6.12);

  // embers inside the button: explicit seeded flicker on 8ths, from the fall to the whip
  ['e1', 'e2', 'e3', 'e4'].forEach(function (k, i) {
    var el = $(k), at = 5.5 + i * .05;
    tl.fromTo(el, { opacity: .5 }, { opacity: 1, duration: .25, ease: 'sine.inOut' }, at);
    for (var j = 1; j < 16; j++) tl.to(el, { opacity: j % 2 ? .45 + rnd() * .2 : 1, duration: .25, ease: 'sine.inOut' }, at + j * .25);
  });

  // 6.5: answer stamps (HUD +1); the button charges
  stamp($('a6'), $('b6'), 6.5);
  tl.fromTo($('charge'), { opacity: 0 }, { opacity: .85, duration: .07, ease: 'none', immediateRender: false }, 6.5);
  tl.to($('charge'), { opacity: 0, duration: .45, ease: 'power2.in' }, 6.57);
  ['e1', 'e2', 'e3', 'e4'].forEach(function (k, i) {
    tl.fromTo($(k), { scale: 1 }, { scale: 2.4, duration: .08, ease: 'power2.out', immediateRender: false }, 6.5 + i * .02);
    tl.to($(k), { scale: 1, duration: .3, ease: 'power2.in' }, 6.58 + i * .02);
  });

  // Scene 10 (7.0–8.5) SHOWCASE: one step per beat, its number circle flashes orange then settles
  [1, 2, 3].forEach(function (n, i) {
    var at = 7.0 + .5 * i;
    tl.fromTo($('st' + n), { scale: 0, y: 40 }, { scale: 1.15, y: 0, duration: .1, ease: 'power3.out' }, at);
    tl.to($('st' + n), { scale: 1, duration: .12, ease: 'power2.inOut' }, at + .1);
    tl.fromTo($('n' + n), { backgroundColor: '#ff6a1f', boxShadow: '0 0 40px 10px rgba(255,106,31,0.85)' },
                          { backgroundColor: '#0f1722', boxShadow: '0 0 0px 0px rgba(255,106,31,0)', duration: .4, ease: 'power2.in' }, at + .12);
    tl.fromTo($('n' + n), { scale: 1 }, { scale: 1.18, duration: .08, ease: 'power2.out', immediateRender: false }, at + .1);
    tl.to($('n' + n), { scale: 1, duration: .22, ease: 'back.out(3)' }, at + .18);
  });
  // 8.5: the security strip slides in under the steps; the steps make room
  tl.fromTo($('stepsy'), { y: 0 }, { y: -30, duration: .3, ease: 'power3.out', immediateRender: false }, 8.5);
  tl.fromTo($('strip'), { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: .28, ease: 'power3.out' }, 8.5);
  ['si1', 'si2', 'si3'].forEach(function (k, i) {
    tl.fromTo($(k), { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .22, ease: 'back.out(2.5)' }, 8.56 + i * .06);
  });

  // Scene 11 (8.5–9.0): the toi dot hops onto the button (lands 9.0)
  hop($('d6x'), $('d6y'), $('d6s'), $('bdip'), 9, -80, 430, 230, 650, 352, 8.5, .5);
  tl.fromTo($('charge'), { opacity: 0 }, { opacity: .6, duration: .06, ease: 'none', immediateRender: false }, 9.0);
  tl.to($('charge'), { opacity: 0, duration: .4, ease: 'power2.in' }, 9.06);
  tl.fromTo($('shine'), { x: 0 }, { x: 1250, duration: .3, ease: 'power2.inOut', immediateRender: false }, 9.04);

  // Scene 12 (9.5–10.0): whip-pan out
  whip($('p6'), 9.5, 1800);   // matches the coolX drift of the quench ring

  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
