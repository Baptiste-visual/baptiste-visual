<script>
(function () {
  var FID = '03-niveau', FRAME_START = 4.8, DUR = 3.2;
  function $(id) { return document.getElementById(FID + '-' + id); }
  var cam = $('cam');
  var root = (cam && cam.closest('[data-composition-id="' + FID + '"]')) || document;
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  /* ---------- deterministic helpers ---------- */
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rnd = mulberry(3032);
  function R(a, b) { return a + (b - a) * rnd(); }
  function el(parent, cls, css) { var d = document.createElement('div'); d.className = cls; if (css) d.style.cssText = css; parent.appendChild(d); return d; }
  function split(node) {
    var txt = node.textContent, out = []; node.textContent = '';
    for (var i = 0; i < txt.length; i++) {
      var s = document.createElement('span'); s.textContent = txt[i] === ' ' ? ' ' : txt[i];
      node.appendChild(s); out.push(s);
    }
    return out;
  }

  /* ---------- lava world: horizon view, seek-safe ----------
     L exposes function setters over S, so every seek updates the params even with
     suppressEvents; the two bracket tweens (DP.a before, DP.b after the lava child
     timeline) redraw exactly once per seek, after all params are set. */
  var lava = MooreaLava.create($('lava'), { seed: 3 });
  var emb = MooreaEmbers.create($('embers'), { seed: 11, count: 80 });
  var S = { t: FRAME_START, heat: 1, panY: 0, erupt: 0, eruptX: 0.5, eruptY: 0.75, flash: 0, boost: 1, esc: 1 };
  var P = { tilt: 0.85, horizon: 0.30, zoom: 1, panX: 0, coolR: 0, coolX: 0.5, coolY: 0.5 };
  function draw() {
    P.t = S.t; P.heat = S.heat; P.panY = S.panY; P.erupt = S.erupt; P.eruptX = S.eruptX; P.eruptY = S.eruptY; P.flash = S.flash;
    lava.render(P); emb.render(S.t, { boost: S.boost, scale: S.esc });
  }
  var L = {};
  Object.keys(S).forEach(function (k) {
    L[k] = function (v) { if (arguments.length) { S[k] = v; return; } return S[k]; };
  });
  var lt = gsap.timeline({ defaults: { lazy: false } });
  var DR = { a: 0, b: 0 };
  var DP = {
    a: function (v) { if (arguments.length) { if (v < DR.a) draw(); DR.a = v; return; } return DR.a; },
    b: function (v) { if (arguments.length) { if (v > DR.b) draw(); DR.b = v; return; } return DR.b; }
  };
  tl.to(DP, { a: DUR, duration: DUR, ease: 'none', lazy: false }, 0);
  tl.add(lt, 0);
  tl.to(DP, { b: DUR, duration: DUR, ease: 'none', lazy: false }, 0);

  // continuous flow across cuts (global time) + the forward swoop over the sea
  lt.to(L, { t: FRAME_START + DUR, duration: DUR, ease: 'none' }, 0);
  lt.to(L, { panY: 6, duration: DUR, ease: 'power2.out' }, 0);

  MUI.hydrate(root);

  var shake = $('shake'), flash = $('flash'), fxB = $('fxback'), fxF = $('fxfront');

  /* ---------- reusable beats ---------- */
  function doShake(t, a, d) {
    d = d || 0.3; var k = d / 0.3;
    tl.to(shake, { keyframes: [
      { x: a, y: -0.6 * a, duration: 0.04 * k }, { x: -0.9 * a, y: 0.6 * a, duration: 0.04 * k },
      { x: 0.7 * a, y: -0.4 * a, duration: 0.05 * k }, { x: -0.5 * a, y: 0.3 * a, duration: 0.05 * k },
      { x: 0.25 * a, y: -0.15 * a, duration: 0.06 * k }, { x: 0, y: 0, duration: 0.06 * k } ], ease: 'none' }, t);
  }
  function droplets(host, t, n, cx, spread, y0, depth) {
    for (var i = 0; i < n; i++) {
      var x = cx + R(-spread, spread), sz = R(7, 19) * depth;
      var d = el(host, '03-niveau-drop', 'left:' + (x - sz / 2) + 'px;top:' + (y0 - sz / 2 - R(0, 18)) + 'px;width:' + sz + 'px;height:' + sz + 'px');
      var dx = (x < cx ? -1 : 1) * R(30, 250) * depth, up = Math.min(R(130, 340) * depth, y0 - 190), tu = R(0.13, 0.21), td = R(0.22, 0.34), ts = t + R(0, 0.06);
      gsap.set(d, { opacity: 0 });
      tl.set(d, { opacity: 1 }, ts);
      tl.to(d, { x: dx, duration: tu + td, ease: 'none' }, ts);
      tl.to(d, { y: -up, duration: tu, ease: 'power2.out' }, ts);
      tl.to(d, { y: -up + R(200, 330) * depth, duration: td, ease: 'power2.in' }, ts + tu);
      tl.to(d, { opacity: 0, scale: 0.4, duration: 0.12, ease: 'power1.in' }, ts + tu + td - 0.12);
    }
  }

  /* =====================================================================
     SCENE 1 (0.00–0.80) — NIVEAU 1 slams, chrome logo drops in
     ===================================================================== */
  // out of the previous frame's white: the cut lands white, decays, re-flashes on the slam
  tl.set(flash, { opacity: 0.9 }, 0);
  tl.to(flash, { opacity: 0.06, duration: 0.11, ease: 'power2.out' }, 0);
  tl.set(flash, { opacity: 0.7 }, 0.12);
  tl.to(flash, { opacity: 0, duration: 0.14, ease: 'power2.out' }, 0.12);
  lt.set(L, { flash: 0.55 }, 0);
  lt.to(L, { flash: 0, duration: 0.22, ease: 'power2.out' }, 0);

  var titleSlam = $('titleslam'), title = $('title');
  var tChars = split(title);
  tl.fromTo(titleSlam, { scale: 2.5 }, { scale: 1, duration: 0.12, ease: 'power4.in' }, 0);
  tl.fromTo(titleSlam, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: 'none' }, 0);
  tl.fromTo(title, { scaleX: 1.14, scaleY: 0.84 }, { scaleX: 1, scaleY: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, 0.12);
  tl.fromTo(title, { color: '#ffe2b8' }, { color: '#e15311', duration: 0.3, ease: 'power2.out' }, 0.12);
  tl.fromTo([$('barl'), $('barr')], { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: 'power3.out' }, 0.12);
  doShake(0.12, 12, 0.18);
  // the slam lights the sea under the title
  lt.set(L, { heat: 1.35, erupt: 0.55, eruptX: 0.5, eruptY: 0.37 }, 0.12);
  lt.to(L, { heat: 1, erupt: 0, duration: 0.5, ease: 'power2.out' }, 0.12);

  // chrome logo drops in on 0.20 (y -200 -> 0, back.out(2))
  var logoDrop = $('logodrop');
  tl.fromTo(logoDrop, { y: -200 }, { y: 0, duration: 0.3, ease: 'back.out(2)' }, 0.2);
  tl.fromTo(logoDrop, { opacity: 0 }, { opacity: 1, duration: 0.07, ease: 'none' }, 0.2);
  doShake(0.3, 6, 0.2);

  // beat 0.40: a light wave runs across NIVEAU 1 and a chrome glint sweeps the logo
  tl.to(titleSlam, { scale: 1.06, duration: 0.06, ease: 'power2.out' }, 0.4);
  tl.to(titleSlam, { scale: 1, duration: 0.24, ease: 'power2.out' }, 0.46);
  tl.to(tChars, { color: '#fff3dc', duration: 0.05, ease: 'none', stagger: 0.03 }, 0.4);
  tl.to(tChars, { color: '#e15311', duration: 0.18, ease: 'power1.out', stagger: 0.03 }, 0.45);
  var sheen = $('sheen');
  tl.fromTo(sheen, { clipPath: 'polygon(-24% 0%, -10% 0%, -20% 100%, -34% 100%)' },
    { clipPath: 'polygon(112% 0%, 126% 0%, 116% 100%, 102% 100%)', duration: 0.34, ease: 'power2.inOut' }, 0.4);
  // 8th 0.60: bars + logo breathe on the off-beat
  tl.fromTo([$('barl'), $('barr')], { scaleY: 1.8 }, { scaleY: 1, duration: 0.18, ease: 'power2.out', immediateRender: false }, 0.6);

  /* =====================================================================
     SCENE 2 (0.80–1.20) — both sink into the lava
     ===================================================================== */
  var hot = $('hot');
  tl.fromTo(hot, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power1.out' }, 0.8);
  tl.to(tChars, { color: '#ffc46a', duration: 0.2, ease: 'power1.out' }, 0.8);
  tl.to([$('titlepos'), $('logopos')], { y: 320, scale: 0.75, opacity: 0, duration: 0.35, ease: 'power2.in' }, 0.8);
  lt.to(L, { erupt: 1, eruptX: 0.5, eruptY: 0.75, duration: 0.18, ease: 'power2.out' }, 0.8);
  lt.to(L, { erupt: 0, duration: 0.42, ease: 'power2.in' }, 0.98);
  // the splash where the logo goes under (≈ 1.0)
  (function () {
    var ring = el(fxF, '03-niveau-ring', 'left:' + (960 - 420) + 'px;top:' + (805 - 60) + 'px;width:840px;height:120px');
    gsap.set(ring, { scale: 0.3, opacity: 0 });
    tl.set(ring, { opacity: 1 }, 1.0);
    tl.to(ring, { scale: 1.15, duration: 0.45, ease: 'power3.out' }, 1.0);
    tl.to(ring, { opacity: 0, duration: 0.26, ease: 'power2.in' }, 1.04);
    var pool = el(fxB, '03-niveau-pool', 'left:' + (960 - 420) + 'px;top:' + (805 - 75) + 'px;width:840px;height:150px');
    gsap.set(pool, { opacity: 0 });
    tl.to(pool, { opacity: 1, duration: 0.06 }, 0.98);
    tl.to(pool, { opacity: 0.3, duration: 0.7, ease: 'power2.out' }, 1.06);
    droplets(fxF, 0.98, 16, 960, 260, 805, 1.15);
  })();
  lt.set(L, { boost: 1 }, 0.8);
  lt.to(L, { boost: 1.8, duration: 0.3, ease: 'power2.out' }, 0.8);

  /* =====================================================================
     SCENE 3 (0.80–2.40) — eight molten words erupt, one per 8th note
     ===================================================================== */
  var WORDS = [
    { n: 1, t: 0.8, x: 350,  y: 300, s: 92,  w: 524 },
    { n: 2, t: 1.0, x: 1500, y: 290, s: 84,  w: 619 },
    { n: 3, t: 1.2, x: 960,  y: 450, s: 124, w: 558 },
    { n: 4, t: 1.4, x: 445,  y: 600, s: 108, w: 679 },
    { n: 5, t: 1.6, x: 1460, y: 570, s: 108, w: 488 },
    { n: 6, t: 1.8, x: 715,  y: 760, s: 100, w: 855 },
    { n: 7, t: 2.0, x: 1540, y: 848, s: 116, w: 634 },
    { n: 8, t: 2.2, x: 500,  y: 900, s: 92,  w: 795 }
  ];
  var BEATS = [1.2, 1.6, 2.0, 2.4, 2.8];
  var wordEls = [], wobEls = [];

  WORDS.forEach(function (W, i) {
    var word = $('w' + W.n), wob = $('wob' + W.n);
    wordEls.push(word); wobEls.push(wob);
    var chars = split(word);
    var foot = W.y + W.s * 0.5 - 4;
    var depth = 0.62 + 0.45 * Math.max(0, foot - 324) / 620;   // nearer the camera = bigger splash

    // erupt: y +120 -> 0, scaleY 0.3 -> 1.15 -> 1, blur 12px -> 0, born white-hot then cooling to molten yellow
    tl.fromTo(word, { filter: 'blur(12px)' }, { filter: 'blur(0px)', duration: 0.26, ease: 'power2.out' }, W.t);
    tl.fromTo(word, { color: '#fff8ea' }, { color: '#ffd76a', duration: 0.36, ease: 'power1.out' }, W.t);
    tl.fromTo(chars, { y: 120, scaleY: 0.3, opacity: 0 },
      { y: 0, scaleY: 1.15, opacity: 1, duration: 0.16, ease: 'power3.out', stagger: { amount: 0.08, from: 'center' } }, W.t);
