  }
  function pop(el, at, sc, dur, ease) {
    tl.fromTo(el, { scale: 0 }, { scale: sc || 1, duration: dur || 0.18, ease: ease || 'back.out(3)' }, at);
  }
  function tap(touch, rip, at) {             // finger lands on the beat: touch ring + clipped ripple
    tl.fromTo(touch, { scale: 1.45, opacity: 0 }, { scale: 1, opacity: 0.95, duration: 0.08, ease: 'power2.out' }, at - 0.08)
      .to(touch, { scale: 0.86, opacity: 0, duration: 0.3, ease: 'power2.out' }, at + 0.12);
    tl.fromTo(rip, { scale: 0, opacity: 0.55 }, { scale: 9, opacity: 0, duration: 0.45, ease: 'power2.out' }, at);
  }

  /* Scene 1 (0.0–0.5): T'ES OÙ ?! erupts from the lava (breakdown mood, heat 0.55) */
  erupt($('probA'), 0);

  /* Scene 2 (0.5–1.0): the Safety Mode card falls, still warm (hot overlay 0.6) */
  var card = $('cardwrap');
  gsap.set(card, { scale: 0.8, transformOrigin: '50% 0%' });
  tl.fromTo(card, { y: -980, rotation: -4, filter: 'blur(5px)' }, { y: 0, rotation: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power2.in' }, 0.5);
  tl.fromTo($('hot'), { opacity: 0.6 }, { opacity: 0, duration: 0.4, ease: 'power2.out' }, 1.0);
  tl.fromTo($('rim'), { opacity: 0.6 }, { opacity: 0, duration: 0.45, ease: 'power2.out' }, 1.0);

  /* Scene 3 (1.0–1.5): soft land + quench, toggle ON at 1.0, compass spins and LOCKS at 1.5 (40deg) */
  tl.to(card, { keyframes: [{ y: -14, duration: 0.1, ease: 'power2.out' }, { y: 0, duration: 0.12, ease: 'power2.in' }] }, 1.0);
  tl.fromTo($('knob'), { x: 0 }, { x: 44, duration: 0.16, ease: 'power3.out' }, 1.0);
  tl.fromTo($('toggle'), { backgroundColor: '#2a3442' }, { backgroundColor: '#e15311', duration: 0.12, ease: 'none' }, 1.0);
  var needle = $('needle');
  tl.fromTo(needle, { rotation: 0 }, { rotation: 470, duration: 0.36, ease: 'power3.out' }, 1.0)
    .to(needle, { rotation: 391, duration: 0.1, ease: 'power2.inOut' }, 1.36)
    .to(needle, { rotation: 400, duration: 0.04, ease: 'power2.out' }, 1.46);
  tl.fromTo($('ping'), { scale: 1, opacity: 0.95 }, { scale: 1.5, opacity: 0, duration: 0.4, ease: 'power2.out', immediateRender: false }, 1.5);

  /* Scene 4 (1.5–2.0): RETROUVE TA BANDE. stamps (HUD +1 at 1.5); the problem word turns to stone */
  petrify($('probA'), $('probA-hot'), $('probA-stone'), 1.5);
  stamp($('ansA'), 1.5);
  hit(1.5, 0.32);
  shake(A, 1.5, 9);

  /* Scene 5 (2.0–4.5) SHOWCASE — the card stays big; one detail per beat / 8th */
  // 2.0  "Créer un groupe" pressed
  tap($('touch0'), $('rip0'), 2.0);
  tl.fromTo($('create'), { scale: 0.95 }, { scale: 1, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, 2.0);
  // 2.5 / 2.75 / 3.0  the group appears: three avatar dots pop on the compass rim around 40deg
  pop($('dot0'), 2.5, 0.5); pop($('dot1'), 2.75, 0.5); pop($('dot2'), 3.0, 0.5);
  tl.fromTo($('ping'), { scale: 1, opacity: 0.55 }, { scale: 1.32, opacity: 0, duration: 0.4, ease: 'power2.out', immediateRender: false }, 3.0);
  // 3.0  glossy SOS pops with a glint sweep (no alarm flashing)
  pop($('sos'), 3.0, 0.95, 0.22, 'back.out(2.2)');
  tl.fromTo($('glint'), { x: -230 }, { x: 320, duration: 0.36, ease: 'power2.inOut' }, 3.06);
  // 3.5  gold CHAT pops; 4.0 the app's two-line hint
  pop($('chat'), 3.5, 0.95, 0.2, 'back.out(2.4)');
  tl.fromTo($('glint2'), { x: -230 }, { x: 240, duration: 0.3, ease: 'power2.inOut' }, 3.56);
  tl.fromTo($('hint'), { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.2, ease: 'power2.out' }, 4.0);
  gsap.set(A, { transformOrigin: '50% 60%' });
  tl.fromTo(A, { scale: 1 }, { scale: 1.025, duration: 4.0, ease: 'none' }, 0.5);   // macro push underneath

  /* Scene 6 (4.5–5.0): WHIP-PAN out — directional blur + light streaks, lava rushes */
  tl.to(A, { x: 40, duration: 0.08, ease: 'power2.out' }, 4.5)
    .to(A, { x: -2300, duration: 0.28, ease: 'power3.in' }, 4.58)
    .set(A, { filter: 'url(#' + ID + '-whipblur)' }, 4.6)
    .fromTo($('whipdev'), { attr: { stdDeviation: '0 0' } }, { attr: { stdDeviation: '80 0' }, duration: 0.26, ease: 'power2.in', immediateRender: false }, 4.6);
  tl.fromTo(streaks, { x: 1900 }, { x: -2100, duration: 0.42, ease: 'power1.in' }, 4.58)
    .fromTo(streaks, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: 'none', immediateRender: false }, 4.6)
    .to(streaks, { opacity: 0, duration: 0.1, ease: 'none' }, 4.92);
  tl.to($('scrim'), { opacity: 0.5, duration: 0.3, ease: 'power1.inOut' }, 4.7);

  /* Scene 7 (5.0–5.5): 1000 QUESTIONS erupts (P8); 40 "?" pop on 32nds and orbit */
  erupt($('probB'), 5.0);
  hit(5.0, 0.22);
  var T0 = 5.0, TS = 6.5;                                   // swarm born / sucked into send
  var CX = 960, CY = 500, RX = 860, RY = 318, SX = 1376, SY = 880;
  function orb(q, t) { var a = q.a0 + q.w * (t - T0); return { x: CX + Math.cos(a) * RX * q.r, y: CY + Math.sin(a) * RY * q.r }; }
  QS.forEach(function (q, i) {
    var p0 = orb(q, T0);
    gsap.set(q.o, { x: p0.x, y: p0.y });
    gsap.set(q.s, { rotation: q.rot });
    tl.fromTo(q.s, { scale: 0 }, { scale: 1, duration: 0.15, ease: 'back.out(3)' }, T0 + (i % 8) * 0.0625);
    var tEnd = TS + q.d, N = 18, kf = [];
    for (var k = 1; k <= N; k++) { var p = orb(q, T0 + (tEnd - T0) * k / N); kf.push({ x: p.x, y: p.y, duration: (tEnd - T0) / N, ease: 'none' }); }
    tl.to(q.o, { keyframes: kf }, T0);
    /* 6.5: sucked into the send button */
    tl.to(q.o, { x: SX, duration: 0.14, ease: 'power2.in' }, tEnd)
      .to(q.o, { y: SY, duration: 0.14, ease: 'power3.in' }, tEnd)
      .to(q.o, { scale: 0.2, duration: 0.14, ease: 'power2.in' }, tEnd)
      .set(q.o, { autoAlpha: 0 }, tEnd + 0.14);
  });
  gsap.set(B, { transformOrigin: '50% 50%' });
  tl.fromTo(B, { scale: 1 }, { scale: 1.02, duration: 4.0, ease: 'none' }, 5.0);

  /* Scene 8 (5.5–6.5): input slides up 5.5, the question types in 5.75–6.5, send pressed 6.5 */
  var inwrap = $('inwrap');
  gsap.set(inwrap, { scale: 1.12, transformOrigin: '50% 50%' });
  tl.fromTo(inwrap, { y: 300, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.26, ease: 'back.out(1.3)' }, 5.5);
  tl.set($('phold'), { display: 'none' }, 5.75)
    .set($('ph'), { attr: { 'class': 'ph typed' } }, 5.75)
    .set($('caret'), { opacity: 1 }, 5.75)
    .set($('caret'), { opacity: 0 }, 6.5)
    /* sent: the field empties back to its placeholder (the question went into the send button) */
    .set($('phtext'), { display: 'none' }, 6.54)
    .set($('phold'), { display: 'inline' }, 6.54)
    .set($('ph'), { attr: { 'class': 'ph' } }, 6.54);
  var STEP = 0.72 / CH.length;
  CH.forEach(function (cs, j) { tl.set(cs, { display: 'inline' }, 5.75 + j * STEP); });
  gsap.set([$('ring0'), $('ring1')], { x: 756, y: 19 });
  tl.fromTo($('send'), { scale: 0.85 }, { scale: 1, duration: 0.22, ease: 'back.out(3)', immediateRender: false }, 6.5);
  tl.fromTo($('ring0'), { scale: 1, opacity: 0.95 }, { scale: 1.9, opacity: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, 6.5);
  tl.fromTo($('ring1'), { scale: 1, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, 6.65);

  /* 6.5: M.A.N.A RÉPOND. stamps (HUD +1); the stone word sinks */
  petrify($('probB'), $('probB-hot'), $('probB-stone'), 6.5);
  stamp($('ansB'), 6.5);
  hit(6.5, 0.3);
  shake(B, 6.5, 8);

  /* Scene 9 (6.75–8.5) SHOWCASE: header, answer bubble, rule, chips per 8th, warning, chip tap */
  tl.fromTo($('bscrim'), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, ease: 'power1.out' }, 6.75);
  tl.fromTo($('mhead'), { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.18, ease: 'back.out(2)' }, 6.75);
  var bubble = $('bubble');
  gsap.set(bubble, { transformOrigin: '0% 100%' });
  tl.fromTo(bubble, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.04, ease: 'none' }, 7.0)
    .fromTo(bubble, { scale: 0.6 }, { scale: 1.04, duration: 0.12, ease: 'power2.out' }, 7.0)
    .to(bubble, { scale: 1, duration: 0.12, ease: 'power2.inOut' }, 7.12);
  tl.fromTo($('hr'), { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: 'power3.out' }, 7.25);
  [0, 1, 2, 3].forEach(function (n) { pop($('chip' + n), 7.5 + n * 0.25, 1, 0.18, 'back.out(3)'); });
  tl.fromTo($('warn'), { y: 12, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.18, ease: 'power2.out' }, 8.0);
  // 8.5: "Navettes" tapped → .mui-chip.on (navy)
  var chip2 = $('chip2');
  tap($('touch1'), $('rip1'), 8.5);
  tl.fromTo(chip2, { backgroundColor: 'rgba(34,54,79,0)', borderColor: '#445162', color: '#b4bcc6' },
    { backgroundColor: '#22364f', borderColor: '#3a4a61', color: '#ffffff', duration: 0.1, ease: 'none', immediateRender: false }, 8.5);
  tl.to(chip2, { keyframes: [{ scale: 0.93, duration: 0.05, ease: 'power2.out' }, { scale: 1, duration: 0.22, ease: 'back.out(3)' }] }, 8.5);

  /* Scene 10 (9.0–10.0): riser — everything vibrates (growing), white-out 9.5 → 10.0 into the drop */
  for (var j = 0; j < 20; j++) {
    var amp = 2 + 4.5 * j / 19, sg = (j % 2 ? -1 : 1);
    tl.set(stage, { x: sg * amp * (j % 3 === 1 ? 0.8 : 1), y: -sg * amp * 0.35 }, 9.0 + j * 0.05);
  }
  gsap.set(stage, { transformOrigin: '50% 50%' });
  tl.fromTo(stage, { scale: 1 }, { scale: 1.04, duration: 1.0, ease: 'power2.in', immediateRender: false }, 9.0);
  tl.fromTo(flash, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in', immediateRender: false }, 9.5);

  draw();
})();
</script>
